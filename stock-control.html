<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NIJA Helmets — Stock Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
try { document.documentElement.setAttribute("data-theme", localStorage.getItem("nija-stock-theme") === "light" ? "light" : "dark"); }
catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
<style>
  :root {
    --signal: #F2A413;
    --signal-ink: #1a1200;
    --bg: #0a0a0c;
    --surface: #17171b;
    --surface-2: #1f1f25;
    --border: #2a2a32;
    --text: #f2f2f4;
    --text-dim: #8b8b95;
    --text-dimmer: #55555f;
    --success: #22c55e;
    --success-ink: #04170c;
    --success-bg: #12281a;
    --success-border: #1c3a26;
    --danger: #ef4444;
    --danger-ink: #2a0808;
    --danger-bg: #2a1416;
    --danger-border: #3a1e20;
    --warn-bg: #2b2113; --warn-fg: #fbbf24; --warn-bd: #3f301b;
    --info-bg: #0c2333; --info-fg: #38bdf8; --info-bd: #143348;
    --chip-hover: #3a3a44;
    --accent-tint: rgba(242,164,19,0.12);
    --accent-tint-border: rgba(242,164,19,0.4);
    --focus-ring: rgba(242,164,19,0.15);
    --empty-icon: #3a3a44;
    --helmet-bg: #0c2333; --helmet-fg: #38bdf8; --helmet-bd: #143348;
    --frame-bg: #10262b; --frame-fg: #2dd4bf; --frame-bd: #17383f;
    --plastic-box-bg: #2b2113; --plastic-box-fg: #fbbf24; --plastic-box-bd: #3f301b;
    --aluminum-box-bg: #1a2029; --aluminum-box-fg: #94a3b8; --aluminum-box-bd: #28303c;
    --leather-bag-bg: #2b1d12; --leather-bag-fg: #fb923c; --leather-bag-bd: #3d2a1a;
    --mirror-bg: #0c262b; --mirror-fg: #22d3ee; --mirror-bd: #12363d;
    --phone-holders-bg: #221a2e; --phone-holders-fg: #a78bfa; --phone-holders-bd: #322745;
    --water-bottle-holders-bg: #181b32; --water-bottle-holders-fg: #818cf8; --water-bottle-holders-bd: #242949;
    --windshield-bg: #23260f; --windshield-fg: #a3e635; --windshield-bd: #333818;
    --brake-pads-bg: #2b1616; --brake-pads-fg: #f87171; --brake-pads-bd: #3d2020;
    --oil-bg: #12261a; --oil-fg: #4ade80; --oil-bd: #1b3826;
    --accessory-bg: #2a1523; --accessory-fg: #f472b6; --accessory-bd: #3d1f32;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 16px;
  }
  html[data-theme="light"] {
    --signal: #b45309;
    --signal-ink: #ffffff;
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --border: #e3e6eb;
    --text: #1c1f27;
    --text-dim: #5c6370;
    --text-dimmer: #9aa2ad;
    --success: #16a34a;
    --success-ink: #ffffff;
    --success-bg: #e8f6ee;
    --success-border: #bfe8cf;
    --danger: #dc2626;
    --danger-ink: #ffffff;
    --danger-bg: #fdecec;
    --danger-border: #f6c9c9;
    --warn-bg: #fdf2df; --warn-fg: #a16207; --warn-bd: #f6e0b5;
    --info-bg: #e8f3fd; --info-fg: #0d6dc4; --info-bd: #c3e0f8;
    --chip-hover: #b9c0c9;
    --accent-tint: rgba(180,83,9,0.08);
    --accent-tint-border: rgba(180,83,9,0.4);
    --focus-ring: rgba(180,83,9,0.18);
    --empty-icon: #c9ced6;

    --helmet-bg: #e8f3fd; --helmet-fg: #0d6dc4; --helmet-bd: #c3e0f8;
    --frame-bg: #e2f6f5; --frame-fg: #0d7d75; --frame-bd: #bce7e3;
    --plastic-box-bg: #fdf2df; --plastic-box-fg: #a16207; --plastic-box-bd: #f6e0b5;
    --aluminum-box-bg: #eef1f5; --aluminum-box-fg: #475569; --aluminum-box-bd: #d3dae3;
    --leather-bag-bg: #fdefe2; --leather-bag-fg: #c2410c; --leather-bag-bd: #f8d7bd;
    --mirror-bg: #e0f6fa; --mirror-fg: #0e7490; --mirror-bd: #b8e6ef;
    --phone-holders-bg: #f2edfc; --phone-holders-fg: #6d28d9; --phone-holders-bd: #ddd0fa;
    --water-bottle-holders-bg: #eceefd; --water-bottle-holders-fg: #4338ca; --water-bottle-holders-bd: #cfd4fa;
    --windshield-bg: #eef7dd; --windshield-fg: #4d7c0f; --windshield-bd: #d5e9b4;
    --brake-pads-bg: #fdeaea; --brake-pads-fg: #b91c1c; --brake-pads-bd: #f6c6c6;
    --oil-bg: #e7f7ec; --oil-fg: #15803d; --oil-bd: #bfe6cb;
    --accessory-bg: #fdecf4; --accessory-fg: #be185d; --accessory-bd: #f9c9de;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "Noto Sans Khmer", "Khmer OS Battambang", "Khmer OS", "Leelawadee UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .2s ease, color .2s ease;
  }
  button, input, select, textarea { font-family: inherit; }
  html[lang="km"] body { line-height: 1.6; }
  html[lang="km"] .tab-btn,
  html[lang="km"] .chip,
  html[lang="km"] .product-name,
  html[lang="km"] .pick-name,
  html[lang="km"] .del-name,
  html[lang="km"] .imp-name { line-height: 1.7; }
  html[lang="km"] .row-stock-label,
  html[lang="km"] .brand-stat-label { line-height: 1.5; }
  #app { max-width: 720px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }

  .loading, .setup-notice {
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    min-height: 70vh; padding: 32px; text-align: center; color: var(--text-dim); font-size: 14px;
  }
  .setup-notice h2 { color: var(--text); font-size: 16px; margin: 0 0 8px; }
  .setup-notice p { max-width: 420px; line-height: 1.5; margin: 0; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--signal);
    border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .shell { border: 1px solid var(--border); border-radius: var(--radius-lg); margin: 16px; overflow: hidden; background: var(--bg); transition: background .2s ease; }
  html[data-theme="light"] .shell { background: var(--surface); box-shadow: 0 1px 3px rgba(20,30,50,0.06); }
  @media (max-width: 480px) { .shell { margin: 0; border-radius: 0; border-left: none; border-right: none; box-shadow: none; } }

  .header { padding: 20px 20px 0; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--radius); background: var(--accent-tint);
    border: 1px solid var(--accent-tint-border); color: var(--signal); display: flex; align-items: center; justify-content: center;
  }
  .brand-text h1 { font-size: 16px; margin: 0; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-text p { font-size: 12px; margin: 1px 0 0; color: var(--text-dim); line-height: 1.2; }
  .header-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .lang-btn { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .theme-btn {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: color .15s ease, border-color .15s ease;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--chip-hover); }

  .tabs { display: flex; gap: 4px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    display: flex; align-items: center; gap: 6px; padding: 10px 12px; font-size: 12px; font-weight: 500;
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); cursor: pointer;
    white-space: nowrap; transition: color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--signal); border-bottom-color: var(--signal); }
  .tab-badge { margin-left: 2px; padding: 1px 6px; border-radius: 999px; background: var(--danger-bg); color: var(--danger); font-size: 11px; font-weight: 600; }

  .content { padding: 20px; }

  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--border);
    background: none; color: var(--text-dim); cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .chip:hover { border-color: var(--chip-hover); }
  .chip-sort { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
  .chip.chip-active { background: var(--accent-tint); border-color: var(--accent-tint-border); color: var(--signal); }
  .btn { display: inline-flex; align-items: center; gap: 5px; border: none; cursor: pointer; font-weight: 500; transition: filter .15s ease; }
  .btn:hover { filter: brightness(1.08); }
  .btn-primary { background: var(--signal); color: var(--signal-ink); padding: 7px 14px; border-radius: 999px; font-size: 12px; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .chip-add { margin-left: auto; }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-dimmer); display: flex; }
  .input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; font-size: 14px; color: var(--text); outline: none; transition: border-color .15s ease;
  }
  .input::placeholder { color: var(--text-dimmer); }
  .input:focus { border-color: var(--signal); box-shadow: 0 0 0 3px var(--focus-ring); }
  .input-search { padding-left: 34px; }

  .product-list, .history-list { display: flex; flex-direction: column; gap: 8px; }
  .product-row, .history-row {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border);
  }
  .product-row { flex-wrap: wrap; }
  html[data-theme="light"] .product-row, html[data-theme="light"] .history-row { background: var(--bg); }
  .product-info { flex: 1; min-width: 0; }
  .row-thumb { width: 42px; height: 42px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border); }
  .row-thumb-placeholder { width: 42px; height: 42px; border-radius: var(--radius-sm); flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-dimmer); }
  .product-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .product-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .cat-tag { font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid transparent; line-height: 1.5; }
  .cat-helmet { background: var(--helmet-bg); color: var(--helmet-fg); border-color: var(--helmet-bd); }
  .cat-frame { background: var(--frame-bg); color: var(--frame-fg); border-color: var(--frame-bd); }
  .cat-plastic-box { background: var(--plastic-box-bg); color: var(--plastic-box-fg); border-color: var(--plastic-box-bd); }
  .cat-aluminum-box { background: var(--aluminum-box-bg); color: var(--aluminum-box-fg); border-color: var(--aluminum-box-bd); }
  .cat-leather-bag { background: var(--leather-bag-bg); color: var(--leather-bag-fg); border-color: var(--leather-bag-bd); }
  .cat-mirror { background: var(--mirror-bg); color: var(--mirror-fg); border-color: var(--mirror-bd); }
  .cat-phone-holders { background: var(--phone-holders-bg); color: var(--phone-holders-fg); border-color: var(--phone-holders-bd); }
  .cat-water-bottle-holders { background: var(--water-bottle-holders-bg); color: var(--water-bottle-holders-fg); border-color: var(--water-bottle-holders-bd); }
  .cat-windshield { background: var(--windshield-bg); color: var(--windshield-fg); border-color: var(--windshield-bd); }
  .cat-brake-pads { background: var(--brake-pads-bg); color: var(--brake-pads-fg); border-color: var(--brake-pads-bd); }
  .cat-oil { background: var(--oil-bg); color: var(--oil-fg); border-color: var(--oil-bd); }
  .cat-accessory { background: var(--accessory-bg); color: var(--accessory-fg); border-color: var(--accessory-bd); }
  .low-flag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--danger); }
  .product-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .product-extra {
    display: flex; gap: 6px; flex-wrap: nowrap; margin-top: 2px; min-width: 0;
    /* 42px thumbnail + 12px row gap keeps it aligned with the product name. */
    flex: 0 0 calc(100% - 54px); margin-left: 54px; box-sizing: border-box;
  }
  .extra-item {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;
    color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: var(--radius-sm); line-height: 1.4;
    min-width: 0; flex: 0 1 auto;
  }
  .extra-ico { display: flex; flex-shrink: 0; }
  .extra-item svg { flex-shrink: 0; color: var(--signal); }
  .extra-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .extra-barcode .extra-text { font-variant-numeric: tabular-nums; }
  /* The location is short, so let the barcode take the leftover room. */
  .extra-item:first-child { flex-shrink: 0; }
  .extra-barcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em; }
  .row-stock { flex-shrink: 0; text-align: right; padding: 0 2px; }
  .row-stock-num { font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--text); }
  .row-stock-num.low { color: var(--danger); }
  .row-stock-label { font-size: 10px; color: var(--text-dimmer); margin-top: 1px; white-space: nowrap; }

  .row-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .icon-btn { background: none; border: none; color: var(--text-dim); padding: 7px; border-radius: var(--radius-sm); cursor: pointer; display: flex; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn-up:hover { background: var(--success-bg); color: var(--success); }
  .icon-btn-down:hover { background: var(--danger-bg); color: var(--danger); }
  .confirm-row { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-shrink: 0; }
  .btn-yes, .btn-no { border: none; padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; }
  .btn-yes { background: var(--danger-bg); color: var(--danger); }
  .btn-no { background: var(--surface-2); color: var(--text-dim); }

  .empty-state { text-align: center; padding: 56px 20px; color: var(--text-dim); }
  .empty-state svg { color: var(--empty-icon); margin-bottom: 12px; }
  .empty-title { font-size: 14px; color: var(--text); margin: 0 0 4px; }
  .empty-sub { font-size: 12px; color: var(--text-dimmer); margin: 0 0 16px; max-width: 320px; margin-left: auto; margin-right: auto; }
  .empty-inline { text-align: center; padding: 40px 0; color: var(--text-dim); font-size: 14px; }

  .stock-form { max-width: 420px; }
  .form-icon-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .form-icon-row h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .form-icon-row svg.icon-up { color: var(--success); }
  .form-icon-row svg.icon-down { color: var(--danger); }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .row-thumb-btn {
    position: relative; padding: 0; border: none; background: none; cursor: pointer;
    flex-shrink: 0; display: block; line-height: 0; border-radius: var(--radius-sm);
  }
  .row-thumb-btn:hover .row-thumb { border-color: var(--signal); }
  .scan-wrap { position: relative; }
  /* 44px keeps the scan target comfortably tappable on a phone. */
  .scan-btn {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--signal);
    cursor: pointer; border-radius: var(--radius); padding: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  .scan-btn:hover, .scan-btn:active { background: var(--accent-tint); border-color: var(--accent-tint-border); }
  /* The delete box is a tall textarea, so pin its button to the top instead. */
  .del-input ~ .scan-btn { top: 6px; transform: none; }
  .input-scan { padding-right: 58px; padding-top: 12px; padding-bottom: 12px; }
  .del-input.input-scan { padding-top: 10px; }

  .chip-scan { display: inline-flex; align-items: center; gap: 5px; border-color: var(--accent-tint-border); color: var(--signal); }

  /* Continuous scan session: list on top, live camera pinned at the bottom. */
  .sess-overlay {
    position: fixed; inset: 0; z-index: 120; background: var(--bg);
    display: flex; flex-direction: column;
  }
  .sess-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .sess-title { font-size: 14px; font-weight: 600; }
  .sess-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px; }
  .sess-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 28px 10px; }
  .sess-row {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); margin-bottom: 8px;
  }
  html[data-theme="light"] .sess-row { background: var(--surface); }
  .sess-info { flex: 1; min-width: 0; }
  .sess-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sess-qty { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .sess-step {
    width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 17px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .sess-step:active { background: var(--accent-tint); }
  .sess-num { min-width: 30px; text-align: center; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sess-del {
    width: 30px; height: 30px; border: none; background: none; color: var(--text-dimmer);
    cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sess-del:hover { color: var(--danger); }
  .sess-cam {
    position: relative; flex-shrink: 0; height: 34vh; min-height: 170px;
    background: #000; overflow: hidden; border-top: 1px solid var(--border);
  }
  .sess-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sess-frame {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(70%, 300px); height: 46%;
    border: 2px solid var(--signal); border-radius: var(--radius); pointer-events: none;
  }
  .sess-flash {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px;
    font-size: 13px; font-weight: 500; text-align: center; color: #fff;
    background: transparent; transition: background .15s ease; pointer-events: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sess-flash-ok { background: rgba(34,197,94,.92); }
  .sess-flash-bad { background: rgba(239,68,68,.92); }
  .sess-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .sess-count { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .sess-foot .btn { padding: 10px 18px; border-radius: var(--radius); font-size: 14px; }

  /* Hardware scanner (USB/Bluetooth "gun") input: it types the code and hits

// Returns the list of symbol values (without start/check/stop) plus which
// subset to use. Subset C halves the width of long all-digit codes.
function code128Values(text) {
  const s = String(text);
  const allDigits = /^\d+$/.test(s) && s.length % 2 === 0 && s.length >= 4;
  if (allDigits) {
    const vals = [];
    for (let i = 0; i < s.length; i += 2) vals.push(parseInt(s.substr(i, 2), 10));
    return { start: 105, values: vals };
  }
  const vals = [];
  for (let i = 0; i < s.length; i++) {
    const code = s.charCodeAt(i);
    // Subset B covers printable ASCII; anything else is replaced so the label
    // still scans rather than producing an invalid symbol.
    vals.push(code >= 32 && code <= 126 ? code - 32 : "?".charCodeAt(0) - 32);
  }
  return { start: 104, values: vals };
}

function code128Symbols(text) {
  const enc = code128Values(text);
  let sum = enc.start;
  for (let i = 0; i < enc.values.length; i++) sum += enc.values[i] * (i + 1);
  const check = sum % 103;
  return [enc.start].concat(enc.values, [check, CODE128_STOP]);
}

function barcodeSvg(text, widthPx, heightPx) {
  const symbols = code128Symbols(text);
  let modules = 0;
  const runs = [];
  for (let i = 0; i < symbols.length; i++) {
    const pattern = CODE128_PATTERNS[symbols[i]];
    for (let j = 0; j < pattern.length; j++) {
      const w = parseInt(pattern[j], 10);
      runs.push({ bar: j % 2 === 0, w: w });
      modules += w;
    }
  }
  let x = 0;
  let rects = "";
  for (let i = 0; i < runs.length; i++) {
    if (runs[i].bar) {
      rects += '<rect x="' + x + '" y="0" width="' + runs[i].w + '" height="' + heightPx + '" fill="#000"/>';
    }
    x += runs[i].w;
  }
  return '<svg class="bc-svg" viewBox="0 0 ' + modules + " " + heightPx +
    '" preserveAspectRatio="none" width="' + widthPx + '" height="' + heightPx +
    '" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">' + rects + "</svg>";
}

// The code printed on a label: prefer the real barcode, fall back to the ID.
function labelCodeFor(p) {

}

// ---------------- in-store barcode generation ----------------
// EAN-13 codes beginning 20-29 are reserved for in-store use, so numbers
// generated here can never collide with a real supplier barcode.
function ean13CheckDigit(twelve) {
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    const d = twelve.charCodeAt(i) - 48;
    sum += (i % 2 === 0) ? d : d * 3;
  }
  return String((10 - (sum % 10)) % 10);
}

function usedBarcodeSet() {
  const set = {};
  for (let i = 0; i < state.products.length; i++) {
    const b = String(state.products[i].barcode || "").trim();
    if (b) set[b] = true;
  }
  return set;
}

// Continues the sequence from whatever in-store codes already exist.
function nextInternalBarcode(used, extraTaken) {
  let seq = 1;
  for (const code in used) {
    if (/^20\d{11}$/.test(code)) {
      const n = parseInt(code.slice(2, 12), 10);
      if (!isNaN(n) && n >= seq) seq = n + 1;
    }
  }
  for (let guard = 0; guard < 200000; guard++) {
    const data = "20" + String(seq).padStart(10, "0");
    const code = data + ean13CheckDigit(data);
    if (!used[code] && !(extraTaken && extraTaken[code])) return code;
    seq++;
  }
  return null;
}

function generateBarcodeForForm() {
  const used = usedBarcodeSet();
  // Don't count the code this product already has as a clash with itself.
  const current = String(state.newBarcode || "").trim();
  if (current) delete used[current];
  const code = nextInternalBarcode(used, null);
  if (!code) return;
  state.newBarcode = code;
  render();
  const el = document.getElementById("newBarcode");
  if (el) el.focus();

async function generateMissingBarcodes() {
  const targets = state.products.filter(p => !String(p.barcode || "").trim());
  if (targets.length === 0) { showToast(t("allHaveCodes")); return; }

  const used = usedBarcodeSet();
  const assigned = {};
  let done = 0, firstErr = null;

  for (let i = 0; i < targets.length; i++) {
    const code = nextInternalBarcode(used, assigned);
    if (!code) break;
    assigned[code] = true;
    used[code] = true;
    try {
      await updateDoc(doc(db, "stock_products", targets[i].id), { barcode: code, updatedAt: Date.now() });
      done++;
    } catch (err) {
      console.error("barcode assign failed", err);
      if (!firstErr) firstErr = err;
    }
  }

  if (firstErr) showToast(describeError(firstErr));
  else showToast(t("generatedCodes") + " " + done);
  render();
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str === null || str === undefined ? "" : String(str);
  return d.innerHTML;
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString(localeTag(), { day: "2-digit", month: "short", year: "numeric" }) +
    " \u00b7 " + d.toLocaleTimeString(localeTag(), { hour: "2-digit", minute: "2-digit" });
}

function describeError(err) {
  const code = err && err.code ? String(err.code) : "";
  if (code.indexOf("permission-denied") !== -1) {
    return t("errPermission");
  }
  if (code.indexOf("unauthenticated") !== -1) {
    return t("errUnauth");
  }
  if (code) {
    return t("errCodePrefix") + code + t("errCodeSuffix");
  }
  return t("errSaveGeneric");
}

function formatRelativeTime(ts) {
  if (!ts) return "";
  const diff = Date.now() - ts;
  const min = 60000, hr = 3600000, day = 86400000;
  if (diff < min) return t("justNow");
  if (diff < hr) return Math.floor(diff / min) + t("minAgo");
  if (diff < day) return Math.floor(diff / hr) + t("hrAgo");
  if (diff < day * 30) return Math.floor(diff / day) + t("dayAgo");
  const d = new Date(ts);
  return d.toLocaleDateString(localeTag(), { day: "2-digit", month: "short" });
}

function calcResizedDimensions(width, height, maxDim) {
  if (width <= maxDim && height <= maxDim) return { width: width, height: height };
  if (width >= height) {
    return { width: maxDim, height: Math.max(1, Math.round(height * maxDim / width)) };
  }
  return { width: Math.max(1, Math.round(width * maxDim / height)), height: maxDim };
}

function resizeImageToBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) {
      reject(new Error("Please choose an image file."));
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not read that image."));
      img.onload = () => {
        try {
          const size = calcResizedDimensions(img.naturalWidth || img.width, img.naturalHeight || img.height, maxDim);
          const canvas = document.createElement("canvas");
          canvas.width = size.width;
          canvas.height = size.height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, size.width, size.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch (err) {
          reject(err);
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Firestore caps a document at 1MB. Photos are stored inside the product
// document, so keep well clear of that ceiling.
const PHOTO_BUDGET = 700000;

function totalPhotoBytes(list) {
  let n = 0;
  for (let i = 0; i < list.length; i++) n += list[i].length;
  return n;
}

async function handlePhotoSelect(fileList) {
  const files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;
  state.photoProcessing = true;
  state.modalError = "";
  render();

  for (let i = 0; i < files.length; i++) {
    if (state.newPhotos.length >= MAX_PHOTOS) {
      state.modalError = t("maxPhotos").replace("{n}", MAX_PHOTOS);
      break;
    }
    try {
      const data = await resizeImageToBase64(files[i], 480, 0.72);
      if (totalPhotoBytes(state.newPhotos) + data.length > PHOTO_BUDGET) {
        state.modalError = t("photosTooLarge");
        break;
      }
      state.newPhotos.push(data);
    } catch (err) {
      console.error(err);
      state.modalError = err && err.message ? err.message : t("photoFailed");
      break;
    }
  }

  state.photoProcessing = false;
  render();
}

function parseIdTerms(raw) {
  const parts = String(raw || "").split(/[\s,;]+/);
  const seen = {};
  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const t = parts[i].trim();
    if (!t) continue;
    const key = t.toLowerCase();
    if (seen[key]) continue;
    seen[key] = true;
    out.push(t);
  }
  return out;
}

function matchIdTerms(terms) {
  const matched = [];
  const seenIds = {};
  const notFound = [];
  for (let i = 0; i < terms.length; i++) {
    const term = terms[i].toLowerCase();
    const hits = state.products.filter(p =>
      (p.productId || "").toLowerCase() === term ||
      (p.barcode || "").toLowerCase() === term
    );
    if (hits.length === 0) {
      notFound.push(terms[i]);
      continue;
    }
    for (let j = 0; j < hits.length; j++) {
      if (!seenIds[hits[j].id]) {
        seenIds[hits[j].id] = true;
        matched.push(hits[j]);
      }
    }
  }
  return { matched: matched, notFound: notFound };
}

// ---------------- spreadsheet reading (offline, no CDN) ----------------
// .xlsx is a ZIP of XML. We read the ZIP central directory ourselves and
// inflate entries with DecompressionStream, so nothing has to load remotely.

function zipU16(dv, off) { return dv.getUint16(off, true); }
function zipU32(dv, off) { return dv.getUint32(off, true); }

function openZip(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const dv = new DataView(arrayBuffer);
  let eocd = -1;
  const lowest = Math.max(0, bytes.length - 66000);
  for (let i = bytes.length - 22; i >= lowest; i--) {
    if (zipU32(dv, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("That doesn't look like a valid .xlsx file.");
  const count = zipU16(dv, eocd + 10);
  const cdOff = zipU32(dv, eocd + 16);
  if (cdOff === 0xffffffff) throw new Error("This .xlsx is too large to read here. Please save it as CSV instead.");
  const files = {};
  let p = cdOff;
  for (let i = 0; i < count; i++) {
    if (p + 46 > bytes.length || zipU32(dv, p) !== 0x02014b50) break;
    const method = zipU16(dv, p + 10);
    const compSize = zipU32(dv, p + 20);
    const nameLen = zipU16(dv, p + 28);
    const extraLen = zipU16(dv, p + 30);
    const commentLen = zipU16(dv, p + 32);
    const localOff = zipU32(dv, p + 42);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    files[name] = { method: method, compSize: compSize, localOff: localOff };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return { bytes: bytes, dv: dv, files: files };
}

async function readZipText(zip, name) {
  const e = zip.files[name];
  if (!e) return null;
  if (zipU32(zip.dv, e.localOff) !== 0x04034b50) throw new Error("This .xlsx file appears to be damaged.");
  const nameLen = zipU16(zip.dv, e.localOff + 26);
  const extraLen = zipU16(zip.dv, e.localOff + 28);
  const start = e.localOff + 30 + nameLen + extraLen;
  const chunk = zip.bytes.subarray(start, start + e.compSize);
  if (e.method === 0) return new TextDecoder().decode(chunk);
  if (e.method !== 8) throw new Error("Unsupported compression inside the .xlsx file.");
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser can't open .xlsx files. Please save the sheet as CSV instead.");
  }
  const stream = new Blob([chunk]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}

function colIndexFromRef(ref) {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64);
    else if (c >= 97 && c <= 122) n = n * 26 + (c - 96);
    else break;
  }
  return n - 1;
}

function parseSharedStrings(xml) {
  if (!xml) return [];
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const sis = doc.getElementsByTagName("si");
  const out = [];
  for (let i = 0; i < sis.length; i++) {
    const ts = sis[i].getElementsByTagName("t");
    let s = "";
    for (let j = 0; j < ts.length; j++) {
      if (ts[j].parentNode && ts[j].parentNode.nodeName === "rPh") continue;
      s += ts[j].textContent;
    }
    out.push(s);
  }
  return out;
}

function parseSheetXml(xml, shared) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const rowEls = doc.getElementsByTagName("row");
  const rows = [];
  for (let i = 0; i < rowEls.length; i++) {
    const cells = rowEls[i].getElementsByTagName("c");
    const arr = [];
    for (let j = 0; j < cells.length; j++) {
      const c = cells[j];
      const ref = c.getAttribute("r") || "";
      let idx = ref ? colIndexFromRef(ref) : j;
      if (idx < 0) idx = j;
      const t = c.getAttribute("t");
      let val = "";
      if (t === "inlineStr") {
        const ts = c.getElementsByTagName("t");
        for (let k = 0; k < ts.length; k++) val += ts[k].textContent;
      } else {
        const v = c.getElementsByTagName("v")[0];
        const raw = v ? v.textContent : "";
        if (t === "s") {
          const si = parseInt(raw, 10);
          val = (si >= 0 && si < shared.length) ? shared[si] : "";
        } else {
          val = raw;
        }
      }
      arr[idx] = val;
    }
    rows.push(arr);
  }
  return rows;
}

async function parseXlsx(arrayBuffer) {
  const zip = openZip(arrayBuffer);
  let sheetName = null;
  if (zip.files["xl/worksheets/sheet1.xml"]) {
    sheetName = "xl/worksheets/sheet1.xml";
  } else {
    const names = Object.keys(zip.files)
      .filter(n => /^xl\/worksheets\/.*\.xml$/.test(n))
      .sort();
    sheetName = names[0] || null;
  }
  if (!sheetName) throw new Error("No worksheet found inside that .xlsx file.");
  const shared = parseSharedStrings(await readZipText(zip, "xl/sharedStrings.xml"));
  const sheetXml = await readZipText(zip, sheetName);
  if (!sheetXml) throw new Error("Could not read the worksheet.");
  return parseSheetXml(sheetXml, shared);
}

function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === "," || ch === "\t" || ch === ";") {
      row.push(field); field = "";
    } else if (ch === "\n") {
      row.push(field); rows.push(row); row = []; field = "";
    } else if (ch !== "\r") {
      field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("Could not read that file."));
    r.onload = () => resolve(r.result);
    r.readAsArrayBuffer(file);
  });
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("Could not read that file."));
    r.onload = () => resolve(r.result);
    r.readAsText(file);
  });
}

async function parseSpreadsheetFile(file) {
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".csv") || name.endsWith(".txt") || name.endsWith(".tsv")) {
    return parseCsv(await readFileAsText(file));
  }
  if (name.endsWith(".xlsx")) {
    return parseXlsx(await readFileAsArrayBuffer(file));
  }
  if (name.endsWith(".xls")) {
    throw new Error("Old .xls files aren't supported. Save as .xlsx or .csv and try again.");
  }
  return parseXlsx(await readFileAsArrayBuffer(file));
}

// Turns raw spreadsheet rows into validated import rows.
// Columns: 1 = product ID or barcode, 2 = quantity, 3 = note (optional).
function buildImportRows(rawRows, mode) {
  let start = 0;
  if (rawRows.length) {
    const firstQty = Number(String(rawRows[0][1] === undefined ? "" : rawRows[0][1]).trim());
    if (!(firstQty > 0)) start = 1; // row 1 is a header
  }
  const out = [];
  const runningOut = {};
  for (let i = start; i < rawRows.length; i++) {
    const r = rawRows[i] || [];
    const idRaw = String(r[0] === undefined ? "" : r[0]).trim();
    const qtyRaw = String(r[1] === undefined ? "" : r[1]).trim();
    const note = String(r[2] === undefined ? "" : r[2]).trim();
    if (!idRaw && !qtyRaw) continue;

    const entry = { rowNum: i + 1, idRaw: idRaw, qty: 0, note: note, product: null, ok: false, message: "" };
    const qtyNum = Number(qtyRaw);

    if (!idRaw) {
      entry.message = t("impMissingId");
    } else {
      const key = idRaw.toLowerCase();
      entry.product = state.products.find(p =>
        (p.productId || "").toLowerCase() === key ||
        (p.barcode || "").toLowerCase() === key
      ) || null;
      if (!entry.product) entry.message = t("impNoMatch") + " \u201c" + idRaw + "\u201d";
    }

    if (!entry.message) {
      if (!qtyRaw) entry.message = t("impMissingQty");
      else if (!isFinite(qtyNum) || qtyNum <= 0 || Math.floor(qtyNum) !== qtyNum) {
        entry.message = t("impWholeNumber");
      } else {
        entry.qty = qtyNum;
      }
    }

    // For stock out, respect what earlier rows in the same file already took.
    if (!entry.message && mode === "out") {
      const used = runningOut[entry.product.id] || 0;
      const left = entry.product.stock - used;
      if (entry.qty > left) {
        entry.message = used > 0
          ? t("impOnly") + " " + left + " " + t("impOnlyLeftAfter")
          : t("impOnly") + " " + entry.product.stock + " " + t("inStock");
      } else {
        runningOut[entry.product.id] = used + entry.qty;
      }
    }

    entry.ok = !entry.message;
    out.push(entry);
  }
  return out;
}

    justNow: "អម្បាញ់មិញ",
    minAgo: " នាទីមុន",
    hrAgo: " ម៉ោងមុន",
    dayAgo: " ថ្ងៃមុន",
  },
};

function t(key) {
  const dict = I18N[state.lang] || I18N.en;
  const v = dict[key];
  if (v !== undefined) return v;
  const fb = I18N.en[key];
  return fb !== undefined ? fb : key;
}

const SYS_NOTE_INITIAL = "Initial stock";
const SYS_NOTE_IMPORT_PREFIX = "Imported from ";
const SYS_NOTE_SCAN = "Scanned";

// System-generated notes are stored in English so they never depend on the
// language the entry was made in. User-typed notes pass through untouched.
function displayNote(note) {
  if (!note) return "";
  if (note === SYS_NOTE_INITIAL) return t("initialStock");
  if (note === SYS_NOTE_SCAN) return t("scannedNote");
  if (note.indexOf(SYS_NOTE_IMPORT_PREFIX) === 0) {
    return t("importedFrom") + " " + note.slice(SYS_NOTE_IMPORT_PREFIX.length);
  }
  return note;
}

function catLabel(cat) {
  if (state.lang === "kh") {
    const kh = CATEGORY_LABELS[cat];
    if (kh) return kh;
  }
  return cat;
}

function localeTag() { return state.lang === "kh" ? "km-KH" : "en-GB"; }

function lowStockCount() {
  return state.products.filter(p => p.stock <= p.threshold).length;
}

// ---------------- render ----------------

function render() {
  const appEl = document.getElementById("app");
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && appEl.contains(active) && active.id) {
    focusId = active.id;
    if (typeof active.selectionStart === "number") {
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }
  appEl.innerHTML = renderAppHTML();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(selStart, selEnd); } catch (err) { /* not a text field */ }
      }
    }
  }
  scrollActiveTabIntoView(appEl);
  syncPrintPageStyle();
}

// The tab strip scrolls sideways on narrow screens, so the selected tab can end
// up off-screen. Nudge the strip just far enough to reveal it.
function scrollActiveTabIntoView(appEl) {
  try {
    const tabsEl = appEl.querySelector(".tabs");
    if (!tabsEl) return;
    const activeEl = tabsEl.querySelector(".tab-btn.active");
    if (!activeEl || !tabsEl.clientWidth) return;
    const pad = 12;
    const left = activeEl.offsetLeft;
    const right = left + activeEl.offsetWidth;
    const viewLeft = tabsEl.scrollLeft;
    const viewRight = viewLeft + tabsEl.clientWidth;
    if (left < viewLeft) {
      tabsEl.scrollLeft = Math.max(0, left - pad);
    } else if (right > viewRight) {
      tabsEl.scrollLeft = right - tabsEl.clientWidth + pad;
    }
  } catch (err) { /* layout not measurable */ }
}

function renderAppHTML() {
  if (FIREBASE_NOT_CONFIGURED) {
    return (
      '<div class="setup-notice">' +
        "<h2>" + t("setupTitle") + "</h2>" +
        "<p>Open this file and paste your Firebase config near the top of the &lt;script&gt; tag \u2014 the same one from your index.html or manage.html if you want this synced with your existing nija-helmets project.</p>" +
      "</div>"
    );
  }
  if (!state.productsLoaded || !state.transactionsLoaded) {
    return '<div class="loading"><span class="spinner"></span> ' + t("loading") + '</div>';
  }
  let body = "";
  if (state.tab === "overview") body = renderOverview();
  else if (state.tab === "in") body = renderStockForm("in");
  else if (state.tab === "out") body = renderStockForm("out");
  else if (state.tab === "history") body = renderHistory();
  else if (state.tab === "delete") body = renderDeleteTab();
  else if (state.tab === "duplicates") body = renderDuplicatesTab();
  else if (state.tab === "labels") body = renderLabelsTab();
  else if (state.tab === "product-form") body = renderProductForm();

  return (
    '<div class="shell">' +
      renderHeader() +
      '<div class="content">' + body + "</div>" +
    "</div>" +
    (state.lightboxProductId ? renderLightbox() : "")
  );
}

          "</div>" +
        "</div>" +

function renderTabsInner() {
  const tabs = [
    { id: "overview", label: t("tabOverview"), icon: "box" },
    { id: "in", label: t("tabIn"), icon: "up" },
    { id: "out", label: t("tabOut"), icon: "down" },
    { id: "history", label: t("tabHistory"), icon: "history" },
    { id: "duplicates", label: t("tabDuplicates"), icon: "copy" },
    { id: "labels", label: t("tabLabels"), icon: "tag" },
    { id: "delete", label: t("tabDelete"), icon: "trash" },
  ];
  const low = lowStockCount();
  const dupCount = duplicateIssueCount();
  return (
    '<div class="tabs">' +
      tabs.map(t =>
        '<button type="button" class="tab-btn' + (state.tab === t.id ? " active" : "") + '" data-action="set-tab" data-tab="' + t.id + '">' +
          icon(t.icon, 14) + " " + t.label +
          (t.id === "overview" && low > 0 ? '<span class="tab-badge">' + low + "</span>" : "") +
          (t.id === "duplicates" && dupCount > 0 ? '<span class="tab-badge">' + dupCount + "</span>" : "") +
        "</button>"
      ).join("") +
    "</div>"
  );
}

function renderOverview() {
  const filtered = state.products
    .filter(p => state.categoryFilter === "All" || p.category === state.categoryFilter)
    .filter(p => {
      const q = state.search.toLowerCase();
      if (!q) return true;
      return p.name.toLowerCase().includes(q) ||
        (p.productId || "").toLowerCase().includes(q) ||
        (p.barcode || "").toLowerCase().includes(q);
    })
    .sort((a, b) => a.name.localeCompare(b.name));

  // Category filter as a dropdown -- nine chips wrapped onto two rows on a phone.
  // Counts come from the full product list, not the filtered one.
  const counts = {};
  for (let i = 0; i < state.products.length; i++) {
    const cat = state.products[i].category;
    counts[cat] = (counts[cat] || 0) + 1;
  }
  // Products saved under a category that has since been retired must stay
  // reachable, so append any leftover values found in the data.
  const extraCats = [];
  for (const cat in counts) {
    if (CATEGORIES.indexOf(cat) === -1 && extraCats.indexOf(cat) === -1) extraCats.push(cat);
  }
  extraCats.sort();

  const chips =
    '<select id="categoryFilter" data-field="categoryFilter" class="input cat-select">' +
      ["All"].concat(CATEGORIES, extraCats).map(c => {
        const n = c === "All" ? state.products.length : (counts[c] || 0);
        return '<option value="' + c + '"' + (state.categoryFilter === c ? " selected" : "") + ">" +
          escapeHtml(c === "All" ? t("allCategories") : catLabel(c)) + " (" + n + ")" +
        "</option>";
      }).join("") +
    "</select>";

  let listHtml;
  if (state.products.length === 0) {
    listHtml = renderEmptyState();
  } else if (filtered.length === 0) {
    listHtml = '<div class="empty-inline">' + t("noMatch") + "</div>";
  } else {
    listHtml = '<div class="product-list">' + filtered.map(renderProductRow).join("") + "</div>";
  }

  return (
    '<div class="filter-row">' + chips +
      '<button type="button" class="btn btn-primary chip-add" data-action="open-add-modal">' + icon("plus", 13) + " " + t("addProduct") + "</button>" +
    "</div>" +
    '<div class="search-wrap">' +
      '<span class="search-icon">' + icon("search", 15) + "</span>" +
      '<input id="search" data-field="search" value="' + escapeHtml(state.search) + '" placeholder="' + escapeHtml(t("searchProducts")) + '" class="input input-search input-scan" />' +
      scanBtn("search") +
    "</div>" +
    listHtml
  );
}

function renderLightbox() {
  const p = state.products.find(x => x.id === state.lightboxProductId);
  if (!p) return "";
  const pics = photosOf(p);
  if (!pics.length) return "";
  const i = Math.min(Math.max(state.lightboxIndex, 0), pics.length - 1);
  const many = pics.length > 1;

  const strip = many
    ? '<div class="lb-strip">' + pics.map((src, n) =>
        '<button type="button" class="lb-thumb' + (n === i ? " lb-thumb-on" : "") + '" data-action="lightbox-pick" data-index="' + n + '">' +
          '<img src="' + src + '" alt="" />' +
        "</button>").join("") + "</div>"
    : "";

  return (
    '<div class="lb-overlay" data-action="close-lightbox">' +
      '<div class="lb-bar">' +
        '<span class="lb-title">' + escapeHtml(p.name) + "</span>" +
        '<button type="button" class="lb-close" data-action="close-lightbox" title="' + escapeHtml(t("close")) + '">' + icon("x", 18) + "</button>" +
      "</div>" +
      '<div class="lb-stage">' +
        (many ? '<button type="button" class="lb-nav lb-prev" data-action="lightbox-prev">' + icon("chevronLeft", 22) + "</button>" : "") +
        '<img class="lb-img" src="' + pics[i] + '" alt="" />' +
        (many ? '<button type="button" class="lb-nav lb-next" data-action="lightbox-next">' + icon("chevronRight", 22) + "</button>" : "") +
      "</div>" +
      (many ? '<div class="lb-counter">' + (i + 1) + " / " + pics.length + "</div>" : "") +
      strip +
    "</div>"
  );
}

        '<div class="product-name-row">' +
          '<span class="product-name">' + escapeHtml(p.name) + "</span>" +
          '<span class="cat-tag ' + catSlug(p.category) + '">' + escapeHtml(catLabel(p.category)) + "</span>" +
          (low ? '<span class="low-flag">' + icon("alert", 12) + " " + t("low") + "</span>" : "") +
        "</div>" +
        '<div class="product-meta">' + t("reorderAt") + " " + p.threshold +

      "</div>" +
      '<div class="row-stock">' +

      '<div class="row-actions">' +
        '<button type="button" class="icon-btn icon-btn-up" title="Stock in" data-action="quick-in" data-id="' + p.id + '">' + icon("up", 14) + "</button>" +
        '<button type="button" class="icon-btn icon-btn-down" title="Stock out" data-action="quick-out" data-id="' + p.id + '">' + icon("down", 14) + "</button>" +
        '<button type="button" class="icon-btn" title="Edit" data-action="open-edit-modal" data-id="' + p.id + '">' + icon("pencil", 14) + "</button>" +
      "</div>" +
      (p.location || p.barcode ?
        '<div class="product-extra">' +
          (p.location ? '<span class="extra-item"><span class="extra-ico">' + icon("pin", 12) + '</span><span class="extra-text">' + escapeHtml(p.location) + "</span></span>" : "") +

function renderStockForm(mode) {
  const isIn = mode === "in";
  const productId = isIn ? state.inProductId : state.outProductId;
  const qty = isIn ? state.inQty : state.outQty;
  const note = isIn ? state.inNote : state.outNote;
  const error = isIn ? state.inError : state.outError;
  const selected = state.products.find(p => p.id === productId);
  const sorted = state.products.slice().sort((a, b) => a.name.localeCompare(b.name));
  const subMode = isIn ? state.inMode : state.outMode;

  const heading = '<div class="form-icon-row">' + icon(isIn ? "up" : "down", 17, isIn ? "icon-up" : "icon-down") +
    "<h2>" + (isIn ? t("stockInTitle") : t("stockOutTitle")) + "</h2></div>";

  if (state.products.length === 0) {
    return heading + '<p class="muted">' + t("addProductFirst") + ' <button type="button" class="link-btn" data-action="open-add-modal">' + t("addOneNow") + "</button></p>";
  }

  const modeToggle =
    '<div class="filter-row">' +
      '<button type="button" class="chip' + (subMode === "single" ? " chip-active" : "") + '" data-action="set-stock-mode" data-mode="' + mode + '" data-sub="single">' + t("modeSingle") + "</button>" +
      '<button type="button" class="chip' + (subMode === "import" ? " chip-active" : "") + '" data-action="set-stock-mode" data-mode="' + mode + '" data-sub="import">' + t("modeImport") + "</button>" +
      '<button type="button" class="chip chip-scan" data-action="start-scan-session" data-mode="' + mode + '">' +
        icon("scan", 14) + " " + t("scanMany") +
      "</button>" +
    "</div>";

  if (subMode === "import") {
    return heading + modeToggle + '<div class="import-page">' + renderImportPanel(mode) + "</div>";
  }

  const options = '<option value="">Select a product\u2026</option>' + sorted.map(p =>
    '<option value="' + p.id + '"' + (p.id === productId ? " selected" : "") + ">" + escapeHtml(p.name) + " (" + escapeHtml(p.category) + ") \u2014 " + p.stock + " in stock</option>"
  ).join("");

  return (
    heading + modeToggle +
    '<form class="stock-form" data-action="submit-stock-' + mode + '">' +
      '<div class="form-col form-col-main">' +
        renderProductPicker(mode, selected, sorted) +
      "</div>" +
      '<div class="form-col form-col-side">' +
      '<div class="form-group">' +
        '<label for="' + mode + 'Qty">' + t("quantity") + "</label>" +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" id="' + mode + 'Qty" data-field="' + mode + 'Qty" value="' + escapeHtml(qty) + '" placeholder="0" class="input" />' +
        (selected && !isIn ? '<p class="hint">' + selected.stock + " " + t("currentlyInStock") + "</p>" : "") +
      "</div>" +
      '<div class="form-group">' +
        '<label for="' + mode + 'Note">' + (isIn ? t("supplierNote") : t("customerNote")) + "</label>" +
        '<input id="' + mode + 'Note" data-field="' + mode + 'Note" value="' + escapeHtml(note) + '" placeholder="' + escapeHtml(isIn ? t("supplierEg") : t("customerEg")) + '" class="input" />' +
      "</div>" +
      (error ? '<p class="form-error">' + escapeHtml(error) + "</p>" : "") +
      '<button type="submit" class="submit-btn ' + (isIn ? "submit-in" : "submit-out") + '">' + (isIn ? t("addStock") : t("removeStock")) + "</button>" +
      "</div>" +
    "</form>"
  );
}

function renderProductPicker(mode, selected, sorted) {
  const searchVal = mode === "in" ? state.inSearch : state.outSearch;

  if (selected) {
    const thumb = selected.photo
      ? '<img class="row-thumb" src="' + selected.photo + '" alt="" />'
      : '<div class="row-thumb-placeholder">' + icon("camera", 16) + "</div>";
    return (
      '<div class="form-group">' +
        "<label>" + t("product") + "</label>" +
        '<div class="picked-row">' +
          thumb +
          '<div class="picked-info">' +
            '<div class="picked-name">' + escapeHtml(selected.name) + "</div>" +
            '<div class="picked-meta">' + selected.stock + " " + t("inStock") + "" +
              (selected.productId ? " \u00b7 " + escapeHtml(selected.productId) : "") +
            "</div>" +
          "</div>" +
          '<button type="button" class="link-btn" data-action="clear-stock-product" data-mode="' + mode + '">' + t("change") + "</button>" +
        "</div>" +
      "</div>"
    );
  }

  const q = searchVal.trim().toLowerCase();
  const matches = sorted.filter(p =>
    !q ||
    p.name.toLowerCase().includes(q) ||
    (p.productId || "").toLowerCase().includes(q) ||
    (p.barcode || "").toLowerCase().includes(q)
  );
  const shown = matches.slice(0, 8);

  const list = shown.map(p => {
    const thumb = p.photo
      ? '<img class="row-thumb" src="' + p.photo + '" alt="" />'
      : '<div class="row-thumb-placeholder">' + icon("camera", 16) + "</div>";
    return (
      '<button type="button" class="pick-row" data-action="select-stock-product" data-mode="' + mode + '" data-id="' + p.id + '">' +
        thumb +
        '<span class="pick-info">' +
          '<span class="pick-name">' + escapeHtml(p.name) + "</span>" +
          '<span class="pick-meta">' +
            (p.productId ? escapeHtml(p.productId) : t("noId")) +
            (p.barcode ? " \u00b7 " + escapeHtml(p.barcode) : "") +
          "</span>" +
        "</span>" +
        '<span class="pick-stock' + (p.stock <= p.threshold ? " low" : "") + '">' + p.stock + "</span>" +
      "</button>"
    );
  }).join("");

  return (
    '<div class="form-group">' +
      '<label for="' + mode + 'Search">' + t("product") + "</label>" +
      '<div class="search-wrap pick-search">' +
        '<span class="search-icon">' + icon("search", 15) + "</span>" +
        '<input id="' + mode + 'Search" data-field="' + mode + 'Search" value="' + escapeHtml(searchVal) +
          '" placeholder="' + escapeHtml(t("pickerSearch")) + '" class="input input-search input-scan" autocomplete="off" />' +
        scanBtn(mode + "Search") +
      "</div>" +
      (matches.length === 0
        ? '<p class="hint">' + t("noProductMatchesThat") + "</p>"
        : '<div class="pick-list">' + list + "</div>" +
          (matches.length > shown.length
            ? '<p class="hint">' + (matches.length - shown.length) + " " + t("moreKeepTyping") + "</p>"
            : "")
      ) +
    "</div>"
  );
}

function renderImportPanel(mode) {

    '<label for="importFile" class="import-drop">' +

// Groups products that share a non-empty value in the given field.
function findDuplicateGroups(field) {
  const map = {};
  for (let i = 0; i < state.products.length; i++) {
    const p = state.products[i];
    const raw = String(p[field] === undefined || p[field] === null ? "" : p[field]).trim();
    if (!raw) continue;
    const key = raw.toLowerCase();
    if (!map[key]) map[key] = { value: raw, items: [] };
    map[key].items.push(p);
  }
  const out = [];
  for (const k in map) if (map[k].items.length > 1) out.push(map[k]);
  out.sort((a, b) => b.items.length - a.items.length || a.value.localeCompare(b.value));
  return out;
}

function duplicateIssueCount() {
  return findDuplicateGroups("productId").length + findDuplicateGroups("barcode").length;
}

const LABEL_SIZES = {
  "40x30": { w: 40, h: 30, name: 7.5, code: 7 },
  "50x30": { w: 50, h: 30, name: 8.5, code: 8 },
  "60x40": { w: 60, h: 40, name: 10,  code: 9 },
  "70x20": { w: 70, h: 20, name: 7.5, code: 7 },
  "70x40": { w: 70, h: 40, name: 11,  code: 9.5 },
  "80x50": { w: 80, h: 50, name: 13,  code: 11 },
};

// A roll printer feeds one label per page, so the page size must match the
// label exactly. Sticker sheets instead tile many labels onto one A4 page.
function syncPrintPageStyle() {
  let el = document.getElementById("print-page-style");
  if (!el) {
    el = document.createElement("style");
    el.id = "print-page-style";
    document.head.appendChild(el);
  }
  const size = LABEL_SIZES[state.labelSize] || LABEL_SIZES["50x30"];
  if (state.labelTarget === "roll") {
    el.textContent =
      "@media print{" +
        "@page{size:" + size.w + "mm " + size.h + "mm;margin:0;}" +
        ".label-sheet{display:block!important;gap:0!important;}" +
        ".lbl{width:" + size.w + "mm!important;height:" + size.h + "mm!important;" +
          "border:none!important;border-radius:0!important;margin:0!important;" +
          "page-break-after:always;break-after:page;}" +
        ".lbl:last-child{page-break-after:auto;break-after:auto;}" +
      "}";
  } else {
    el.textContent = "@media print{@page{size:auto;margin:8mm;}}";
  }
}

function renderHistory() {
  if (state.transactions.length === 0) {
    return (
      '<div class="empty-state">' + icon("history", 30) +
      '<p class="empty-title">' + t("noActivityTitle") + "</p>" +
      '<p class="empty-sub">' + t("noActivitySub") + "</p></div>"
    );
  }

  // Transactions store the product's document id, so look up the product to let
  // people search by the Product ID or barcode they actually know.
  const byDocId = {};
  for (let i = 0; i < state.products.length; i++) byDocId[state.products[i].id] = state.products[i];

  const q = state.historySearch.trim().toLowerCase();
  const filtered = state.transactions.filter(t => {
    if (state.historyFilter !== "all" && t.type !== state.historyFilter) return false;
    if (!q) return true;
    const p = byDocId[t.productId];
    return (t.productName || "").toLowerCase().includes(q) ||
      (t.note || "").toLowerCase().includes(q) ||
      displayNote(t.note).toLowerCase().includes(q) ||
      (p && (p.productId || "").toLowerCase().includes(q)) ||
      (p && (p.barcode || "").toLowerCase().includes(q));
  });

  const filters = [["all", t("all")], ["in", t("tabIn")], ["out", t("tabOut")]];
  const chips = filters.map(f =>
    '<button type="button" class="chip' + (state.historyFilter === f[0] ? " chip-active" : "") + '" data-action="set-history-filter" data-filter="' + f[0] + '">' + f[1] + "</button>"
  ).join("") +
  '<button type="button" class="chip chip-sort" data-action="toggle-history-sort">' +
    icon(state.historySort === "desc" ? "sortDesc" : "sortAsc", 13) + " " +
    (state.historySort === "desc" ? t("sortNewest") : t("sortOldest")) +
  "</button>";

  const search =
    '<div class="search-wrap">' +
      '<span class="search-icon">' + icon("search", 15) + "</span>" +
      '<input id="historySearch" data-field="historySearch" value="' + escapeHtml(state.historySearch) +
        '" placeholder="' + escapeHtml(t("searchHistory")) + '" class="input input-search input-scan" autocomplete="off" />' +
      scanBtn("historySearch") +
    "</div>";

  if (filtered.length === 0) {
    return '<div class="filter-row">' + chips + "</div>" + search +
      '<div class="empty-inline">' + t("noMatchingActivity") + "</div>";
  }

  if (state.historySort === "asc") filtered.reverse();

  let totalIn = 0, totalOut = 0;
  for (let i = 0; i < filtered.length; i++) {
    if (filtered[i].type === "in") totalIn += filtered[i].qty;
    else totalOut += filtered[i].qty;
  }
  const net = totalIn - totalOut;

  const summary =
    '<div class="hist-summary">' +
      '<span class="imp-pill imp-pill-ok">+' + totalIn + " " + t("inWord") + "</span>" +
      '<span class="imp-pill imp-pill-bad">-' + totalOut + " " + t("outWord") + "</span>" +
      '<span class="hist-net">' + t("netWord") + " " + (net >= 0 ? "+" : "") + net + " \u00b7 " + filtered.length + " " + (filtered.length === 1 ? t("recordOne") : t("recordMany")) + "</span>" +
    "</div>";

  const rows = filtered.map(t =>
    '<div class="history-row">' +
      '<div class="history-icon ' + (t.type === "in" ? "history-icon-in" : "history-icon-out") + '">' + icon(t.type === "in" ? "up" : "down", 13) + "</div>" +
      '<div class="history-info">' +
        '<div class="history-name">' + escapeHtml(t.productName) + "</div>" +
        '<div class="history-meta">' + formatDate(t.date) + (t.note ? " \u00b7 " + escapeHtml(displayNote(t.note)) : "") + "</div>" +
      "</div>" +
      '<div class="history-amount ' + (t.type === "in" ? "amount-in" : "amount-out") + '">' + (t.type === "in" ? "+" : "-") + t.qty + "</div>" +
    "</div>"
  ).join("");

  return '<div class="filter-row">' + chips + "</div>" + search + summary +
    '<div class="history-list">' + rows + "</div>";
}

          "</div>" : ""
        ) +
