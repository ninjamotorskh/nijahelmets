// ---------------- barcode scanning ----------------
// The scanner overlay lives OUTSIDE #app and is managed imperatively: render()
// replaces #app's innerHTML, which would tear down the <video> and drop the
// camera stream mid-scan.
let scanEl = null, scanStream = null, scanTimer = null, scanTarget = null;

// Cameras are only available on a secure origin. Opening the saved .html file
// directly (file:// or content://) will always fail, no matter the permission.
function isSecureOrigin() {
  try {
    if (window.isSecureContext) return true;
    const loc = window.location;
    if (loc.protocol === "https:") return true;
    return loc.hostname === "localhost" || loc.hostname === "127.0.0.1";
  } catch (e) {
    return false;
  }
}

// ---------------- barcode reader ----------------
// Android Chrome has a built-in BarcodeDetector. Safari (iPhone) does not, so
// there a decoder is fetched on demand and driven off canvas frames. Both
// paths expose the same detect(video) -> code | null.
const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/+esm";
let zxingModule = null;
let zxingLoader = () => import(/* @vite-ignore */ ZXING_URL);

async function createBarcodeReader() {
  if (typeof BarcodeDetector !== "undefined") {
    let formats = null;
    try { formats = await BarcodeDetector.getSupportedFormats(); } catch (e) { formats = null; }
    const detector = (formats && formats.length) ? new BarcodeDetector({ formats: formats }) : new BarcodeDetector();
    return {
      native: true,
      detect: async (video) => {
        const found = await detector.detect(video);
        return (found && found.length && found[0].rawValue) ? String(found[0].rawValue) : null;
      },
    };
  }

  if (!zxingModule) zxingModule = await zxingLoader();
  const Z = zxingModule;

  const hints = new Map();
  try {
    // iPhone runs this pure-JS decoder, so every hint has a real per-frame
    // cost. The labels and supplier codes are all linear 1D barcodes, so the
    // 2D (QR) search and TRY_HARDER's extra rotations/scanlines are pure
    // overhead -- dropping them is what makes the scan feel near-instant
    // instead of taking many seconds.
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
      Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E,
      Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF,
    ]);
  } catch (e) { /* fall back to defaults */ }

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  // Core reader path: build the bitmap ourselves rather than relying on any
  // particular browser-helper method existing in the published build.
  let core = null;
  try {
    if (Z.MultiFormatReader && Z.RGBLuminanceSource && Z.BinaryBitmap && Z.HybridBinarizer) {
      core = new Z.MultiFormatReader();
      if (core.setHints) core.setHints(hints);
    }
  } catch (e) { core = null; }

  // Older helper as a second option.
  let helper = null;
  if (!core && Z.BrowserMultiFormatReader) {
    try { helper = new Z.BrowserMultiFormatReader(hints); } catch (e) { helper = null; }
  }
  if (!core && !helper) throw new Error("No usable decoder in the barcode library");

  const isNotFound = (err) => {
    if (!err) return true;
    const n = (err.name || "") + " " + (err.constructor ? err.constructor.name : "") + " " + (err.message || "");
    return /NotFound|No MultiFormat Readers|not found/i.test(n);
  };

  let hardErrors = 0;
  return {
    native: false,
    detect: async (video) => {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return null;

      // Only the middle of the frame matters -- that is where the aiming box
      // is. Cropping is both faster and less prone to misreads from whatever
      // else is in shot.
      const cropW = Math.max(1, Math.round(vw * 0.86));
      const cropH = Math.max(1, Math.round(vh * 0.42));
      const sx = Math.round((vw - cropW) / 2);
      const sy = Math.round((vh - cropH) / 2);

      // A full 1080p frame is slow to decode on a phone; ~720px across is
      // plenty for a linear barcode that fills the box, and roughly halves the
      // per-frame work versus a larger canvas.
      const scale = Math.min(1, 720 / cropW);
      const w = Math.max(1, Math.round(cropW * scale));
      const h = Math.max(1, Math.round(cropH * scale));
      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, w, h);

      try {
        if (core) {
          const rgba = ctx.getImageData(0, 0, w, h).data;
          const gray = new Uint8ClampedArray(w * h);
          for (let i = 0, j = 0; j < gray.length; i += 4, j++) {
            gray[j] = (rgba[i] * 0.299 + rgba[i + 1] * 0.587 + rgba[i + 2] * 0.114) | 0;
          }
          const source = new Z.RGBLuminanceSource(gray, w, h);
          const bitmap = new Z.BinaryBitmap(new Z.HybridBinarizer(source));
          const result = core.decode(bitmap, hints);
          if (core.reset) core.reset();
          hardErrors = 0;
          return result ? String(result.getText()) : null;
        }
        const result = helper.decodeFromCanvas(canvas);
        hardErrors = 0;
        return result ? String(result.getText()) : null;
      } catch (err) {
        if (isNotFound(err)) return null;   // just no barcode in this frame
        // A genuine fault would otherwise fail silently on every frame.
        hardErrors++;
        if (hardErrors === 1) console.error("barcode decode error", err);
        if (hardErrors > 8) throw err;   // ~2s of real faults, not a transient blip
        return null;
      }
    },
  };
}

// ---------------- continuous scan session ----------------
// A POS-style flow: the camera stays open at the bottom and each scanned item
// stacks up in the list above. Built outside #app and updated imperatively so
// a re-render never tears down the live <video>.
let sessEl = null, sessStream = null, sessTimer = null, sessMode = null;
let sessCart = [];
let sessLastCode = null, sessLastAt = 0, sessCodeInView = false, sessAbsentFrames = 0;
let sessPendingCode = null, sessPendingCount = 0;

function sessProductFor(code) {
  const key = String(code).trim().toLowerCase();
  if (!key) return null;
  return state.products.find(p =>
    (p.barcode || "").toLowerCase() === key || (p.productId || "").toLowerCase() === key
  ) || null;
}

function sessFlash(text, bad) {
  if (!sessEl) return;
  const el = sessEl.querySelector(".sess-flash");
  if (!el) return;
  el.textContent = text;
  el.className = "sess-flash" + (bad ? " sess-flash-bad" : " sess-flash-ok");
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (el) { el.textContent = ""; el.className = "sess-flash"; } }, 1600);
}

function sessTotal() {
  return sessCart.reduce((n, r) => n + r.qty, 0);
}

function renderSessList() {
  if (!sessEl) return;
  const listEl = sessEl.querySelector(".sess-list");
  const footEl = sessEl.querySelector(".sess-foot");
  if (!listEl || !footEl) return;

  listEl.innerHTML = sessCart.length === 0
    ? '<div class="sess-empty">' + escapeHtml(t("scanCartEmpty")) + "</div>"
    : sessCart.map((r, i) =>
        '<div class="sess-row">' +
          '<div class="sess-info">' +
            '<div class="sess-name">' + escapeHtml(r.name) + "</div>" +
            '<div class="sess-meta">' + escapeHtml(r.code) +
              (sessMode === "out" ? " \u00b7 " + r.stock + " " + escapeHtml(t("inStock")) : "") +
            "</div>" +
          "</div>" +
          '<div class="sess-qty">' +
            '<button type="button" class="sess-step" data-sess="dec" data-i="' + i + '">\u2212</button>' +
            '<span class="sess-num">' + r.qty + "</span>" +
            '<button type="button" class="sess-step" data-sess="inc" data-i="' + i + '">+</button>' +
          "</div>" +
          '<button type="button" class="sess-del" data-sess="del" data-i="' + i + '">' + icon("x", 14) + "</button>" +
        "</div>"
      ).join("");

  const n = sessTotal();
  const label = sessMode === "in" ? t("addStockForRows") : t("removeStockForRows");
  footEl.innerHTML =
    '<span class="sess-count">' + n + " " + escapeHtml(t("scanItems")) + "</span>" +
    '<button type="button" class="btn ' + (sessMode === "in" ? "btn-primary" : "btn-danger") + '" data-sess="apply"' +
      (n === 0 ? " disabled" : "") + ">" + escapeHtml(label) + "</button>";
}

function sessAddCode(code) {
  const now = Date.now();
  // While the same barcode stays in front of the camera it is one item, not
  // many. It only counts again once it has actually left the frame.
  if (code === sessLastCode && now - sessLastAt < 150) return;
  if (code === sessLastCode && sessCodeInView) return;
  sessLastCode = code;
  sessLastAt = now;
  sessCodeInView = true;

  const p = sessProductFor(code);
  if (!p) {
    sessFlash(t("scanNotFound") + " " + code, true);
    return;
  }
  try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) { /* not supported */ }

  const existing = sessCart.find(r => r.id === p.id);
  if (existing) {
    if (sessMode === "out" && existing.qty >= p.stock) {
      sessFlash(t("errOnly") + " " + p.stock + " " + t("inStock"), true);
      renderSessList();
      return;
    }
    existing.qty += 1;
    sessFlash(p.name + " \u00d7" + existing.qty, false);
  } else {
    if (sessMode === "out" && p.stock < 1) {
      sessFlash(t("errOnly") + " 0 " + t("inStock"), true);
      return;
    }
    sessCart.unshift({ id: p.id, name: p.name, code: labelCodeFor(p) || code, qty: 1, stock: p.stock });
    sessFlash(p.name, false);
  }
  renderSessList();
}

function stopScanSession() {
  if (sessTimer) { clearTimeout(sessTimer); sessTimer = null; }
  if (sessStream) {
    sessStream.getTracks().forEach(tr => { try { tr.stop(); } catch (e) { /* already stopped */ } });
    sessStream = null;
  }
  if (sessEl && sessEl.parentNode) sessEl.parentNode.removeChild(sessEl);
  sessEl = null; sessMode = null; sessCart = [];
  sessLastCode = null; sessLastAt = 0; sessCodeInView = false; sessAbsentFrames = 0;
  sessPendingCode = null; sessPendingCount = 0;
  try { document.body.style.overflow = ""; } catch (e) { /* no body */ }
}

async function applyScanSession() {
  if (!sessCart.length || !sessMode) return;
  const mode = sessMode;
  const rows = sessCart.slice();
  const now = Date.now();
  let applied = 0, firstErr = null;

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const p = state.products.find(x => x.id === r.id);
    if (!p) continue;
    const newStock = mode === "in" ? p.stock + r.qty : Math.max(0, p.stock - r.qty);
    try {
      await updateDoc(doc(db, "stock_products", p.id), { stock: newStock, updatedAt: now });
      await addDoc(collection(db, "stock_transactions"), {
        productId: p.id, productName: p.name, type: mode, qty: r.qty,
        note: SYS_NOTE_SCAN, date: now,
      });
      applied += r.qty;
    } catch (err) {
      console.error("scan session apply failed", err);
      if (!firstErr) firstErr = err;
    }
  }

  stopScanSession();
  if (firstErr) {
    showToast(describeError(firstErr));
  } else {
    showToast((mode === "in" ? t("toastStockedIn") : t("toastStockedOut")) + " " + applied);
  }
  render();
}

async function startScanSession(mode) {
  if (sessEl) return;
  sessMode = mode;
  sessCart = [];
  sessLastCode = null; sessLastAt = 0; sessCodeInView = false; sessAbsentFrames = 0;
  sessPendingCode = null; sessPendingCount = 0;

  sessEl = document.createElement("div");
  sessEl.className = "sess-overlay";
  sessEl.innerHTML =
    '<div class="sess-bar">' +
      '<span class="sess-title">' + escapeHtml(mode === "in" ? t("tabIn") : t("tabOut")) + " \u00b7 " + escapeHtml(t("scanMany")) + "</span>" +
      '<button type="button" class="lb-close" data-sess="close" aria-label="' + escapeHtml(t("close")) + '">' + icon("x", 18) + "</button>" +
    "</div>" +
    '<div class="sess-hw">' +
      '<input class="sess-hw-input" type="text" inputmode="text" autocomplete="off" ' +
        'autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" ' +
        'placeholder="' + escapeHtml(t("hwScanPlaceholder")) + '">' +
    "</div>" +
    '<div class="sess-list"></div>' +
    '<div class="sess-cam">' +
      '<video class="sess-video" playsinline muted autoplay></video>' +
      '<div class="sess-frame"></div>' +
      '<div class="sess-cam-ph">' +
        icon("scan", 30) +
        '<div class="sess-cam-ph-title">' + escapeHtml(t("hwScanTitle")) + "</div>" +
        '<div class="sess-cam-ph-hint">' + escapeHtml(t("hwScanHint")) + "</div>" +
      "</div>" +
      '<div class="sess-flash"></div>' +
    "</div>" +
    '<div class="sess-foot"></div>';
  document.body.appendChild(sessEl);
  try { document.body.style.overflow = "hidden"; } catch (e) { /* no body */ }

  sessEl.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-sess]");
    if (!btn) return;
    const act = btn.dataset.sess;
    if (act === "close") { stopScanSession(); render(); return; }
    if (act === "apply") { applyScanSession(); return; }
    const i = parseInt(btn.dataset.i, 10);
    const row = sessCart[i];
    if (!row) return;
    if (act === "inc") {
      const p = state.products.find(x => x.id === row.id);
      if (sessMode === "out" && p && row.qty >= p.stock) {
        sessFlash(t("errOnly") + " " + p.stock + " " + t("inStock"), true);
      } else row.qty += 1;
    } else if (act === "dec") {
      row.qty -= 1;
      if (row.qty < 1) sessCart.splice(i, 1);
    } else if (act === "del") {
      sessCart.splice(i, 1);
    }
    renderSessList();
    focusHwInput();
  });

  // ----- hardware scanner (USB / Bluetooth "gun") + manual typing -----
  // A scanner types the barcode into the focused field and sends Enter, so a
  // kept-focused input is all that is needed -- no camera required. This is the
  // way to use "Scan many" on a computer.
  const hwInput = sessEl.querySelector(".sess-hw-input");
  // Phones use the camera, and auto-focusing here would pop up the on-screen
  // keyboard, so only grab focus on devices with a real pointer (a computer).
  const isTouch = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  function focusHwInput() {
    if (isTouch || !hwInput) return;
    try { hwInput.focus(); } catch (e) { /* not focusable */ }
  }
  if (hwInput) {
    hwInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const code = hwInput.value.trim();
      hwInput.value = "";
      if (!code) return;
      // A deliberate trigger-pull is always a fresh item, so don't let the
      // camera's "same code still in view" guard swallow a repeat scan.
      sessCodeInView = false;
      sessAddCode(code);
      focusHwInput();
    });
    // If focus drifts (e.g. after clicking a button), a click anywhere that
    // isn't a control brings it back so the next scan still lands.
    sessEl.addEventListener("click", (e) => {
      if (!e.target.closest("[data-sess], .sess-hw-input")) focusHwInput();
    });
  }

  renderSessList();
  focusHwInput();

  // The camera is a bonus, not a requirement. When it isn't there (e.g. a
  // computer with no webcam or with permission blocked), the black panel turns
  // into a calm "scanner ready" panel and the hardware input carries on.
  function camUnavailable() {
    const cam = sessEl && sessEl.querySelector(".sess-cam");
    if (cam) cam.classList.add("sess-cam-off");
    focusHwInput();
  }

  if (!isSecureOrigin() || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camUnavailable(); return; }

  try {
    sessStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 }, height: { ideal: 720 },
        focusMode: { ideal: "continuous" },
      }, audio: false,
    });
  } catch (err) {
    console.error("camera failed", err);
    camUnavailable();
    return;
  }
  if (!sessEl) { sessStream.getTracks().forEach(tr => tr.stop()); sessStream = null; return; }

  const video = sessEl.querySelector(".sess-video");
  video.srcObject = sessStream;
  try { await video.play(); } catch (e) { /* autoplay attribute covers this */ }

  let reader;
  try {
    if (typeof BarcodeDetector === "undefined") sessFlash(t("scanLoading"), false);
    reader = await createBarcodeReader();
    if (!sessEl) return;
  } catch (err) {
    console.error("barcode reader failed to load", err);
    sessFlash(t("scanReaderFailed"), true);
    return;
  }

  // Same rule as the single scanner: confirm a code across a couple of frames
  // before trusting it, so one bad decode can't add the wrong product. The
  // check digit ZXing validates makes two reads a safe, fast bar.
  const needed = 2;
  let misses = 0;

  const tick = async () => {
    if (!sessEl) return;
    try {
      const code = await reader.detect(video);
      if (code) {
        misses = 0;
        sessAbsentFrames = 0;
        const trimmed = String(code).trim();
        if (trimmed === sessPendingCode) sessPendingCount++;
        else { sessPendingCode = trimmed; sessPendingCount = 1; }
        if (sessPendingCount >= needed) sessAddCode(trimmed);
      } else {
        // The JS decoder often drops a frame between two good reads, so only
        // forget the pending code after several blank frames -- otherwise it
        // never reaches the confirmation count and the scan drags on.
        if (++misses >= 4) { sessPendingCode = null; sessPendingCount = 0; misses = 0; }
        // A few clear frames in a row means the item really has left the view,
        // so the same code may be scanned again as a new item.
        sessAbsentFrames++;
        if (sessAbsentFrames >= 3) sessCodeInView = false;
      }
    } catch (err) {
      console.error("scanning stopped", err);
      sessFlash(t("scanReaderFailed"), true);
      return;
    }
    sessTimer = setTimeout(tick, reader.native ? 120 : 60);
  };
  sessTimer = setTimeout(tick, 250);
}

function scanMessage(text) {
  if (!scanEl) return;
  const el = scanEl.querySelector(".scan-msg");
  if (el) el.textContent = text;
}

function stopScan() {
  if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
  if (scanStream) {
    scanStream.getTracks().forEach(tr => { try { tr.stop(); } catch (e) { /* already stopped */ } });
    scanStream = null;
  }
  if (scanEl && scanEl.parentNode) scanEl.parentNode.removeChild(scanEl);
  scanEl = null;
  scanTarget = null;
  try { document.body.style.overflow = ""; } catch (e) { /* no body */ }
}

function applyScan(field, code) {
  const value = String(code || "").trim();
  stopScan();
  if (!value) return;
  if (field === "deleteQuery") {
    // Scanning several items in a row should build a list, not overwrite it.
    const existing = state.deleteQuery.trim();
    const already = parseIdTerms(existing).some(t => t.toLowerCase() === value.toLowerCase());
    applyFieldValue(field, already ? existing : (existing ? existing + ", " + value : value));
  } else {
    applyFieldValue(field, value);
  }
  render();
  const el = document.getElementById(field);
  if (el) el.focus();
}

async function startScan(field) {
  if (scanEl) return;
  scanTarget = field;

  scanEl = document.createElement("div");
  scanEl.className = "scan-overlay";
  scanEl.innerHTML =
    '<div class="scan-bar">' +
      '<span class="scan-title">' + escapeHtml(t("scanTitle")) + "</span>" +
      '<button type="button" class="lb-close scan-close" aria-label="' + escapeHtml(t("close")) + '">' + icon("x", 18) + "</button>" +
    "</div>" +
    '<div class="scan-stage">' +
      '<video class="scan-video" playsinline muted autoplay></video>' +
      '<div class="scan-frame"></div>' +
    "</div>" +
    '<p class="scan-msg">' + escapeHtml(t("scanHint")) + "</p>";
  document.body.appendChild(scanEl);
  try { document.body.style.overflow = "hidden"; } catch (e) { /* no body */ }

  scanEl.querySelector(".scan-close").addEventListener("click", stopScan);
  scanEl.addEventListener("click", (e) => { if (e.target === scanEl) stopScan(); });

  if (!isSecureOrigin()) {
    scanMessage(t("scanInsecure"));
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    scanMessage(t("scanNoCamera"));
    return;
  }

  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 }, height: { ideal: 720 },
        focusMode: { ideal: "continuous" },
      }, audio: false,
    });
  } catch (err) {
    console.error("camera failed", err);
    scanMessage(err && err.name === "NotAllowedError" ? t("scanDenied") : t("scanNoCamera"));
    return;
  }
  if (!scanEl) { // closed while the permission prompt was up
    scanStream.getTracks().forEach(tr => tr.stop());
    scanStream = null;
    return;
  }

  const video = scanEl.querySelector(".scan-video");
  video.srcObject = scanStream;
  try { await video.play(); } catch (e) { /* autoplay attribute covers this */ }

  let reader;
  try {
    if (typeof BarcodeDetector === "undefined") scanMessage(t("scanLoading"));
    reader = await createBarcodeReader();
    if (!scanEl) return;
    scanMessage(t("scanHint"));
  } catch (err) {
    console.error("barcode reader failed to load", err);
    scanMessage(t("scanReaderFailed"));
    return;
  }

  // A single frame can decode incorrectly, so a code is only accepted after
  // the same value has been read more than once. EAN/UPC/Code128 all carry a
  // check digit that ZXing already validates, so two reads is a safe, fast bar.
  const needed = 2;
  let pending = null, pendingCount = 0, misses = 0;

  const tick = async () => {
    if (!scanEl) return;
    try {
      const code = await reader.detect(video);
      if (code) {
        misses = 0;
        if (code === pending) pendingCount++;
        else { pending = code; pendingCount = 1; }
        if (pendingCount >= needed) { applyScan(scanTarget, code); return; }
      } else {
        // The JS decoder often returns nothing between two good reads; wiping
        // the count on the first blank frame is what made this take seconds.
        // Only forget the pending code after several blank frames in a row.
        if (++misses >= 4) { pending = null; pendingCount = 0; misses = 0; }
      }
    } catch (err) {
      console.error("scanning stopped", err);
      scanMessage(t("scanReaderFailed"));
      return;
    }
    scanTimer = setTimeout(tick, reader.native ? 120 : 60);
  };
  scanTimer = setTimeout(tick, 250);
}

function openLightbox(id) {
  const p = state.products.find(x => x.id === id);
  if (!p || photosOf(p).length === 0) return;
  state.lightboxProductId = id;
  state.lightboxIndex = 0;
  try { document.body.style.overflow = "hidden"; } catch (e) { /* no body yet */ }
  render();
}

function closeLightbox() {
  state.lightboxProductId = null;
  state.lightboxIndex = 0;
  try { document.body.style.overflow = ""; } catch (e) { /* no body */ }
  render();
}

function stepLightbox(delta) {
  const p = state.products.find(x => x.id === state.lightboxProductId);
  if (!p) return;
  const pics = photosOf(p);
  if (pics.length < 2) return;
  state.lightboxIndex = (state.lightboxIndex + delta + pics.length) % pics.length;
  render();
}

function toggleLang() {
  state.lang = state.lang === "kh" ? "en" : "kh";
  document.documentElement.setAttribute("lang", state.lang === "kh" ? "km" : "en");
  try { localStorage.setItem("nija-stock-lang", state.lang); } catch (e) { /* private browsing */ }
  render();
}

function closeModal() {
  state.tab = state.returnTab || "overview";
  state.editingProductId = null;
  state.modalError = "";
  render();
}

async function saveProduct() {
  const name = state.newName.trim();
  if (!name) { state.modalError = t("errNameRequired"); render(); return; }
  const threshold = Math.max(0, parseInt(state.newThreshold, 10) || 0);
  const priceTrimmed = state.newPrice.trim();
  const price = priceTrimmed === "" ? null : Math.max(0, parseFloat(priceTrimmed) || 0);
  const productId = state.newProductId.trim();
  const barcode = state.newBarcode.trim();
  const location = state.newLocation.trim();
  const photos = state.newPhotos.slice();
  const photo = photos[0] || "";  // first image doubles as the thumbnail everywhere else

  if (state.editingProductId) {
    try {
      await updateDoc(doc(db, "stock_products", state.editingProductId), {
        name: name, category: state.newCategory, threshold: threshold,
        productId: productId, barcode: barcode, price: price, location: location,
        photo: photo, photos: photos,
        updatedAt: Date.now(),
      });
      showToast(t("toastUpdated") + " " + name);
      closeModal();
    } catch (err) {
      console.error(err);
      state.modalError = describeError(err);
      render();
    }
    return;
  }

  const startStock = Math.max(0, parseInt(state.newStock, 10) || 0);
  const now = Date.now();
  try {
    const ref = await addDoc(collection(db, "stock_products"), {
      name: name, category: state.newCategory, stock: startStock, threshold: threshold,
      productId: productId, barcode: barcode, price: price, location: location,
      photo: photo, photos: photos,
      createdAt: now, updatedAt: now,
    });
    if (startStock > 0) {
      await addDoc(collection(db, "stock_transactions"), {
        productId: ref.id, productName: name, type: "in", qty: startStock, note: SYS_NOTE_INITIAL, date: now,
      });
    }
    showToast(t("toastAdded") + " " + name);
    closeModal();
  } catch (err) {
    console.error(err);
    state.modalError = describeError(err);
    render();
  }
}

function resetImport() {
  state.importRows = [];
  state.importFileName = "";
  state.importError = "";
  state.importParsing = false;
  state.importApplying = false;
}

async function handleImportFile(file, mode) {
  state.importFor = mode;
  state.importParsing = true;
  state.importError = "";
  state.importRows = [];
  state.importFileName = file.name || "file";
  render();
  try {
    const raw = await parseSpreadsheetFile(file);
    state.importRows = buildImportRows(raw, mode);
    if (state.importRows.length === 0) {
      state.importError = t("noDataRows");
    }
  } catch (err) {
    console.error(err);
    state.importRows = [];
    state.importError = err && err.message ? err.message : "Could not read that file.";
  }
  state.importParsing = false;
  render();
}

async function applyImport() {
  const mode = state.importFor;
  const valid = state.importRows.filter(r => r.ok);
  if (valid.length === 0 || (mode !== "in" && mode !== "out")) return;

  state.importApplying = true;
  state.importError = "";
  render();

  // One stock write per product, but one history entry per spreadsheet row
  // so each row's note is preserved.
  const groups = {};
  for (let i = 0; i < valid.length; i++) {
    const r = valid[i];
    if (!groups[r.product.id]) groups[r.product.id] = { product: r.product, total: 0, rows: [] };
    groups[r.product.id].total += r.qty;
    groups[r.product.id].rows.push(r);
  }

  const now = Date.now();
  let appliedRows = 0;
  let firstErr = null;
  const ids = Object.keys(groups);

  for (let i = 0; i < ids.length; i++) {
    const g = groups[ids[i]];
    const newStock = mode === "in" ? g.product.stock + g.total : g.product.stock - g.total;
    try {
      await updateDoc(doc(db, "stock_products", g.product.id), { stock: newStock, updatedAt: now });
    } catch (err) {
      console.error("import stock update failed for", g.product.id, err);
      if (!firstErr) firstErr = err;
      continue; // don't log transactions for a stock change that didn't happen
    }
    for (let j = 0; j < g.rows.length; j++) {
      const r = g.rows[j];
      try {
        await addDoc(collection(db, "stock_transactions"), {
          productId: g.product.id,
          productName: g.product.name,
          type: mode,
          qty: r.qty,
          note: r.note || (SYS_NOTE_IMPORT_PREFIX + state.importFileName),
          date: now,
        });
        appliedRows++;
      } catch (err) {
        console.error("import transaction failed", err);
        if (!firstErr) firstErr = err;
      }
    }
  }

  state.importApplying = false;
  if (firstErr) {
    state.importError = t("appliedOf") + " " + appliedRows + "/" + valid.length + " " + t("rowsOf") + " " + describeError(firstErr);
  } else {
    showToast((mode === "in" ? t("toastStockedIn") : t("toastStockedOut")) + " " + appliedRows + " " + (appliedRows === 1 ? t("rowOne") : t("rowMany")));
    resetImport();
  }
  render();
}

function downloadImportTemplate() {
  const csv = "Product ID or Barcode,Quantity,Note\n9500001,10,ABC Trading\n9500002,5,\n";
  try {
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "stock-import-template.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (err) {
    console.error(err);
    showToast("Could not create the template file");
  }
}

async function performBulkDelete() {
  const selected = state.products.filter(p => state.deleteSelected[p.id]);
  if (selected.length === 0) return;

  state.deleteBusy = true;
  state.deleteError = "";
  render();

  let done = 0;
  let firstErr = null;
  for (let i = 0; i < selected.length; i++) {
    try {
      await deleteDoc(doc(db, "stock_products", selected[i].id));
      done++;
    } catch (err) {
      console.error("delete failed for", selected[i].id, err);
      if (!firstErr) firstErr = err;
    }
  }

  state.deleteBusy = false;
  state.deleteConfirming = false;

  if (firstErr) {
    state.deleteError = "Deleted " + done + " of " + selected.length + ". " + describeError(firstErr);
  } else {
    state.deleteQuery = "";
    state.deleteSelected = {};
    showToast(t("toastDeleted") + " " + done + " " + (done === 1 ? t("productOne") : t("productMany")));
  }
  render();
}

async function submitStockIn() {
  state.inError = "";
  const product = state.products.find(p => p.id === state.inProductId);
  const qty = parseInt(state.inQty, 10);
  if (!product) { state.inError = t("errChooseProduct"); render(); return; }
  if (!qty || qty <= 0) { state.inError = t("errQtyPositive"); render(); return; }
  try {
    await updateDoc(doc(db, "stock_products", product.id), { stock: product.stock + qty, updatedAt: Date.now() });
    await addDoc(collection(db, "stock_transactions"), {
      productId: product.id, productName: product.name, type: "in", qty: qty, note: state.inNote.trim(), date: Date.now(),
    });
    showToast("+" + qty + " " + product.name);
    state.inProductId = ""; state.inQty = ""; state.inNote = "";
    render();
  } catch (err) {
    console.error(err);
    state.inError = describeError(err);
    render();
  }
}

async function submitStockOut() {
  state.outError = "";
  const product = state.products.find(p => p.id === state.outProductId);
  const qty = parseInt(state.outQty, 10);
  if (!product) { state.outError = t("errChooseProduct"); render(); return; }
  if (!qty || qty <= 0) { state.outError = t("errQtyPositive"); render(); return; }
  if (qty > product.stock) { state.outError = t("errOnly") + " " + product.stock + " " + t("errInStock"); render(); return; }
  try {
    await updateDoc(doc(db, "stock_products", product.id), { stock: product.stock - qty, updatedAt: Date.now() });
    await addDoc(collection(db, "stock_transactions"), {
      productId: product.id, productName: product.name, type: "out", qty: qty, note: state.outNote.trim(), date: Date.now(),
    });
    showToast("-" + qty + " " + product.name);
    state.outProductId = ""; state.outQty = ""; state.outNote = "";
    render();
  } catch (err) {
    console.error(err);
    state.outError = describeError(err);
    render();
  }
}

// ---------------- event delegation ----------------

const appEl = document.getElementById("app");

appEl.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "set-tab") setTab(el.dataset.tab);
  else if (action === "set-history-filter") { state.historyFilter = el.dataset.filter; render(); }
  else if (action === "toggle-history-sort") {
    state.historySort = state.historySort === "desc" ? "asc" : "desc";
    render();
  }
  else if (action === "open-add-modal") openAddModal();
  else if (action === "open-edit-modal") openEditModal(el.dataset.id);
  else if (action === "close-modal") closeModal();
  else if (action === "select-stock-product") {
    const m = el.dataset.mode;
    if (m === "in") { state.inProductId = el.dataset.id; state.inSearch = ""; state.inError = ""; }
    else { state.outProductId = el.dataset.id; state.outSearch = ""; state.outError = ""; }
    render();
  }
  else if (action === "clear-stock-product") {
    const m = el.dataset.mode;
    if (m === "in") { state.inProductId = ""; state.inSearch = ""; }
    else { state.outProductId = ""; state.outSearch = ""; }
    render();
    const s = document.getElementById((m === "in" ? "in" : "out") + "Search");
    if (s) s.focus();
  }
  else if (action === "set-stock-mode") {
    const m = el.dataset.mode;
    const sub = el.dataset.sub;
    if (m === "in") state.inMode = sub; else state.outMode = sub;
    if (sub === "import" && state.importFor !== m) resetImport();
    render();
  }
  else if (action === "apply-import") applyImport();
  else if (action === "download-template") downloadImportTemplate();
  else if (action === "toggle-delete-select") {
    const id = el.dataset.id;
    if (state.deleteSelected[id]) delete state.deleteSelected[id];
    else state.deleteSelected[id] = true;
    state.deleteConfirming = false;
    render();
  }
  else if (action === "ask-bulk-delete") { state.deleteConfirming = true; state.deleteError = ""; render(); }
  else if (action === "cancel-bulk-delete") { state.deleteConfirming = false; render(); }
  else if (action === "confirm-bulk-delete") performBulkDelete();
  else if (action === "quick-in") { state.tab = "in"; state.inProductId = el.dataset.id; state.inError = ""; render(); }
  else if (action === "quick-out") { state.tab = "out"; state.outProductId = el.dataset.id; state.outError = ""; render(); }
  else if (action === "remove-photo") {
    state.newPhotos.splice(parseInt(el.dataset.index, 10), 1);
    state.modalError = "";
    render();
  }
  else if (action === "set-main-photo") {
    const idx = parseInt(el.dataset.index, 10);
    if (idx > 0) {
      const pick = state.newPhotos.splice(idx, 1)[0];
      state.newPhotos.unshift(pick);
      render();
    }
  }
  else if (action === "toggle-theme") toggleTheme();
  else if (action === "toggle-lang") toggleLang();
  else if (action === "scan") startScan(el.dataset.scanField);
  else if (action === "start-scan-session") startScanSession(el.dataset.mode);
  else if (action === "toggle-label-select") {
    const id = el.dataset.id;
    if (state.labelSelected[id]) delete state.labelSelected[id];
    else state.labelSelected[id] = true;
    render();
  }
  else if (action === "label-select-all") {
    const q = state.labelSearch.trim().toLowerCase();
    state.products.forEach(p => {
      const match = !q || p.name.toLowerCase().includes(q) ||
        (p.productId || "").toLowerCase().includes(q) || (p.barcode || "").toLowerCase().includes(q);
      if (match) state.labelSelected[p.id] = true;
    });
    render();
  }
  else if (action === "label-clear") { state.labelSelected = {}; render(); }
  else if (action === "generate-barcode") generateBarcodeForForm();
  else if (action === "generate-missing") generateMissingBarcodes();
  else if (action === "print-labels") { try { window.print(); } catch (err) { console.error(err); } }
  else if (action === "open-lightbox") openLightbox(el.dataset.id);
  else if (action === "close-lightbox") {
    // Ignore clicks that land on the picture or the strip -- only the
    // backdrop and the X should dismiss it.
    if (e.target.closest(".lb-stage") || e.target.closest(".lb-strip")) {
      if (!e.target.closest(".lb-close")) return;
    }
    closeLightbox();
  }
  else if (action === "lightbox-prev") stepLightbox(-1);
  else if (action === "lightbox-next") stepLightbox(1);
  else if (action === "lightbox-pick") { state.lightboxIndex = parseInt(el.dataset.index, 10) || 0; render(); }
});

appEl.addEventListener("submit", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  e.preventDefault();
  const action = el.dataset.action;
  if (action === "submit-stock-in") submitStockIn();
  else if (action === "submit-stock-out") submitStockOut();
  else if (action === "submit-product") saveProduct();
});

// Applying a field value from typing OR from a barcode scan must behave
// identically, so both go through here.
function applyFieldValue(field, value) {
  state[field] = value;

  if (field === "deleteQuery") {
    state.deleteConfirming = false;
    state.deleteError = "";
    // Pasting IDs selects exactly those products; clearing the box clears the
    // selection so nothing stays armed for deletion by accident.
    state.deleteSelected = {};
    const hits = matchIdTerms(parseIdTerms(value)).matched;
    for (let i = 0; i < hits.length; i++) state.deleteSelected[hits[i].id] = true;
  }

  // A barcode scanner types the whole code then Enter. If what's typed exactly
  // matches one product's ID or barcode, pick it straight away.
  if (field === "inSearch" || field === "outSearch") {
    const key = String(value).trim().toLowerCase();
    if (key) {
      const hits = state.products.filter(p =>
        (p.productId || "").toLowerCase() === key || (p.barcode || "").toLowerCase() === key
      );
      if (hits.length === 1) {
        if (field === "inSearch") { state.inProductId = hits[0].id; state.inSearch = ""; state.inError = ""; }
        else { state.outProductId = hits[0].id; state.outSearch = ""; state.outError = ""; }
      }
    }
  }
}

appEl.addEventListener("input", (e) => {
  if (e.target.tagName === "SELECT") return;
  const field = e.target.dataset.field;
  if (!field) return;
  let value = e.target.value;
  if (e.target.inputMode === "numeric") {
    value = value.replace(/[^0-9]/g, "");
  } else if (e.target.inputMode === "decimal") {
    value = value.replace(/[^0-9.]/g, "");
    const dot = value.indexOf(".");
    if (dot !== -1) value = value.slice(0, dot + 1) + value.slice(dot + 1).replace(/\./g, "");
  }
  applyFieldValue(field, value);
  render();
});

appEl.addEventListener("change", (e) => {
  if (e.target.id === "newPhotoInput") {
    if (e.target.files && e.target.files.length) handlePhotoSelect(e.target.files);
    e.target.value = "";
    return;
  }
  if (e.target.id === "importFile") {
    const file = e.target.files && e.target.files[0];
    if (file) handleImportFile(file, e.target.dataset.mode);
    return;
  }
  if (e.target.tagName !== "SELECT") return;
  const field = e.target.dataset.field;
  if (field) { state[field] = e.target.value; render(); }
});

// ---------------- Firestore live sync ----------------

if (!FIREBASE_NOT_CONFIGURED) {
  onSnapshot(collection(db, "stock_products"), (snap) => {
    state.products = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    state.productsLoaded = true;
    render();
  }, (err) => {
    console.error("stock_products listener error", err);
    state.productsLoaded = true;
    render();
  });

  const txnQuery = query(collection(db, "stock_transactions"), orderBy("date", "desc"));
  onSnapshot(txnQuery, (snap) => {
    state.transactions = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    state.transactionsLoaded = true;
    render();
  }, (err) => {
    console.error("stock_transactions listener error", err);
    state.transactionsLoaded = true;
    render();
  });
}

// Arrow keys / Escape while the lightbox is open.
document.addEventListener("keydown", (e) => {
  if (!state.lightboxProductId) return;
  if (e.key === "Escape") { closeLightbox(); }
  else if (e.key === "ArrowLeft") { stepLightbox(-1); }
  else if (e.key === "ArrowRight") { stepLightbox(1); }
  else return;
  e.preventDefault();
});

// Swipe left/right on touch devices.
let lbTouchX = null;
appEl.addEventListener("touchstart", (e) => {
  if (!state.lightboxProductId || !e.touches || !e.touches.length) return;
  lbTouchX = e.touches[0].clientX;
}, { passive: true });
appEl.addEventListener("touchend", (e) => {
  if (lbTouchX === null || !state.lightboxProductId) { lbTouchX = null; return; }
  const endX = e.changedTouches && e.changedTouches.length ? e.changedTouches[0].clientX : null;
  const dx = endX === null ? 0 : endX - lbTouchX;
  lbTouchX = null;
  if (Math.abs(dx) > 40) stepLightbox(dx < 0 ? 1 : -1);
}, { passive: true });

(function initLang() {
  let l = "kh";
  try { l = localStorage.getItem("nija-stock-lang") === "en" ? "en" : "kh"; } catch (e) { l = "kh"; }
  state.lang = l;
  document.documentElement.setAttribute("lang", l === "kh" ? "km" : "en");
})();

(function initTheme() {
  let t = document.documentElement.getAttribute("data-theme");
  if (t !== "light" && t !== "dark") {
    try { t = localStorage.getItem("nija-stock-theme") === "light" ? "light" : "dark"; } catch (e) { t = "dark"; }
  }
  state.theme = t;
  document.documentElement.setAttribute("data-theme", t);
})();

render();
</script>
