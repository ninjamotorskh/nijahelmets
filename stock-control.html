<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NIJA Helmets — Stock Control</title>
<style>
  :root {
    --signal: #F2A413;
    --signal-ink: #1a1200;
    --bg: #0a0a0c;
    --surface: #17171b;
    --surface-2: #1f1f25;
    --border: #2a2a32;
    --text: #f2f2f4;
    --text-dim: #8b8b95;
    --text-dimmer: #55555f;
    --success: #22c55e;
    --success-bg: #12281a;
    --success-border: #1c3a26;
    --danger: #ef4444;
    --danger-bg: #2a1416;
    --danger-border: #3a1e20;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; }
  #app { max-width: 720px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }

  .loading, .setup-notice {
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    min-height: 70vh; padding: 32px; text-align: center; color: var(--text-dim); font-size: 14px;
  }
  .setup-notice h2 { color: var(--text); font-size: 16px; margin: 0 0 8px; }
  .setup-notice p { max-width: 420px; line-height: 1.5; margin: 0; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--signal);
    border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .shell { border: 1px solid var(--border); border-radius: var(--radius-lg); margin: 16px; overflow: hidden; background: var(--bg); }
  @media (max-width: 480px) { .shell { margin: 0; border-radius: 0; border-left: none; border-right: none; } }

  .header { padding: 20px 20px 0; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--radius); background: rgba(242,164,19,0.12);
    border: 1px solid rgba(242,164,19,0.35); color: var(--signal); display: flex; align-items: center; justify-content: center;
  }
  .brand-text h1 { font-size: 16px; margin: 0; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-text p { font-size: 12px; margin: 1px 0 0; color: var(--text-dim); line-height: 1.2; }
  .brand-stat { text-align: right; flex-shrink: 0; }
  .brand-stat-num { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .brand-stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .tabs { display: flex; gap: 4px; margin-top: 16px; overflow-x: auto; }
  .tab-btn {
    display: flex; align-items: center; gap: 6px; padding: 10px 12px; font-size: 12px; font-weight: 500;
    background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); cursor: pointer;
    white-space: nowrap; transition: color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--signal); border-bottom-color: var(--signal); }
  .tab-badge { margin-left: 2px; padding: 1px 6px; border-radius: 999px; background: var(--danger-bg); color: var(--danger); font-size: 11px; font-weight: 600; }

  .content { padding: 20px; }

  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--border);
    background: none; color: var(--text-dim); cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .chip:hover { border-color: #3a3a44; }
  .chip.chip-active { background: rgba(242,164,19,0.12); border-color: rgba(242,164,19,0.4); color: var(--signal); }
  .btn { display: inline-flex; align-items: center; gap: 5px; border: none; cursor: pointer; font-weight: 500; transition: filter .15s ease; }
  .btn:hover { filter: brightness(1.08); }
  .btn-primary { background: var(--signal); color: var(--signal-ink); padding: 7px 14px; border-radius: 999px; font-size: 12px; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .chip-add { margin-left: auto; }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-dimmer); display: flex; }
  .input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; font-size: 14px; color: var(--text); outline: none; transition: border-color .15s ease;
  }
  .input::placeholder { color: var(--text-dimmer); }
  .input:focus { border-color: var(--signal); box-shadow: 0 0 0 3px rgba(242,164,19,0.15); }
  .input-search { padding-left: 34px; }

  .product-list, .history-list { display: flex; flex-direction: column; gap: 8px; }
  .product-row, .history-row {
    display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--border);
  }
  .product-info { flex: 1; min-width: 0; }
  .product-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .product-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .cat-tag { font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid transparent; line-height: 1.5; }
  .cat-helmet { background: #0c2333; color: #38bdf8; border-color: #143348; }
  .cat-bag { background: #1e1533; color: #a78bfa; border-color: #2c2049; }
  .cat-glove { background: #0f2a20; color: #34d399; border-color: #163d2e; }
  .cat-motors { background: #2a1420; color: #fb7185; border-color: #3d1c2c; }
  .low-flag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--danger); }
  .product-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; font-variant-numeric: tabular-nums; }

  .row-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .icon-btn { background: none; border: none; color: var(--text-dim); padding: 7px; border-radius: var(--radius-sm); cursor: pointer; display: flex; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn-up:hover { background: var(--success-bg); color: var(--success); }
  .icon-btn-down:hover { background: var(--danger-bg); color: var(--danger); }
  .confirm-row { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-shrink: 0; }
  .btn-yes, .btn-no { border: none; padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; }
  .btn-yes { background: var(--danger-bg); color: var(--danger); }
  .btn-no { background: var(--surface-2); color: var(--text-dim); }

  .empty-state { text-align: center; padding: 56px 20px; color: var(--text-dim); }
  .empty-state svg { color: #3a3a44; margin-bottom: 12px; }
  .empty-title { font-size: 14px; color: var(--text); margin: 0 0 4px; }
  .empty-sub { font-size: 12px; color: var(--text-dimmer); margin: 0 0 16px; max-width: 320px; margin-left: auto; margin-right: auto; }
  .empty-inline { text-align: center; padding: 40px 0; color: var(--text-dim); font-size: 14px; }

  .stock-form { max-width: 420px; }
  .form-icon-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .form-icon-row h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .form-icon-row svg.icon-up { color: var(--success); }
  .form-icon-row svg.icon-down { color: var(--danger); }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .hint { font-size: 12px; color: var(--text-dimmer); margin: 5px 0 0; font-variant-numeric: tabular-nums; }
  .form-error { font-size: 12px; color: var(--danger); margin: 0 0 12px; }
  .muted { color: var(--text-dim); font-size: 13px; }
  .link-btn { background: none; border: none; color: var(--signal); font-weight: 500; font-size: 13px; cursor: pointer; padding: 0; }
  .link-btn:hover { text-decoration: underline; }

  .submit-btn { width: 100%; padding: 11px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s ease; }
  .submit-btn:hover { filter: brightness(1.1); }
  .submit-in { background: var(--success); color: #04170c; }
  .submit-out { background: var(--danger); color: #2a0808; }

  .history-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .history-icon-in { background: var(--success-bg); color: var(--success); }
  .history-icon-out { background: var(--danger-bg); color: var(--danger); }
  .history-info { flex: 1; min-width: 0; }
  .history-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .history-amount { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .amount-in { color: var(--success); }
  .amount-out { color: var(--danger); }

  .product-form-page { max-width: 420px; }
  .page-actions { display: flex; gap: 8px; margin-top: 20px; }
  .page-actions .btn { flex: 1; justify-content: center; padding: 9px; border-radius: var(--radius); font-size: 13px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 60; max-width: 90vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--signal); outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

// ============================================================
// Connected to your existing nija-helmets Firebase project.
// Only projectId + apiKey are needed here — Firestore doesn't use
// authDomain/storageBucket/messagingSenderId/appId (those are for
// Auth, Storage, and Messaging, which this app doesn't touch).
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyApyTWsALmtURKP73n8zYi6hAT7lzzgJOk",
  projectId: "nija-helmets",
};

const FIREBASE_NOT_CONFIGURED = !firebaseConfig.projectId;
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

const CATEGORIES = ["Helmet", "Bag", "Glove", "Motors"];
const CATEGORY_CLASS = { Helmet: "cat-helmet", Bag: "cat-bag", Glove: "cat-glove", Motors: "cat-motors" };

const ICONS = {
  box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><polyline points="3.29,7 12,12 20.71,7"/><line x1="12" y1="22" x2="12" y2="12"/>',
  up: '<polyline points="4,17 10,11 14,15 20,7"/><polyline points="14,7 20,7 20,13"/>',
  down: '<polyline points="4,7 10,13 14,9 20,17"/><polyline points="14,17 20,17 20,11"/>',
  history: '<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>',
  search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  alert: '<polygon points="12,3 22,20 2,20"/><line x1="12" y1="9" x2="12" y2="15"/>',
  x: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
  trash: '<polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  pencil: '<path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  inbox: '<polyline points="22,12 16,12 14,15 10,15 8,12 2,12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>',
};
function icon(name, size, extraClass) {
  return '<svg class="' + (extraClass || '') + '" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
}

const state = {
  products: [],
  transactions: [],
  productsLoaded: false,
  transactionsLoaded: false,
  tab: "overview",
  categoryFilter: "All",
  search: "",
  historyFilter: "all",
  returnTab: "overview",
  editingProductId: null,
  confirmDeleteId: null,
  modalError: "",
  inProductId: "",
  inQty: "",
  inNote: "",
  inError: "",
  outProductId: "",
  outQty: "",
  outNote: "",
  outError: "",
  newName: "",
  newCategory: CATEGORIES[0],
  newStock: "",
  newThreshold: "5",
};

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str === null || str === undefined ? "" : String(str);
  return d.innerHTML;
}

function formatDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) +
    " \u00b7 " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

function describeError(err) {
  const code = err && err.code ? String(err.code) : "";
  if (code.indexOf("permission-denied") !== -1) {
    return "Blocked by Firestore security rules \u2014 add a rule allowing read/write on stock_products and stock_transactions.";
  }
  if (code.indexOf("unauthenticated") !== -1) {
    return "Firestore rejected this as unauthenticated \u2014 check your security rules.";
  }
  if (code) {
    return "Could not save (" + code + "). Open the browser console (F12) for details.";
  }
  return "Could not save. Check your connection.";
}

function totalUnits() {
  return state.products.reduce((sum, p) => sum + p.stock, 0);
}
function lowStockCount() {
  return state.products.filter(p => p.stock <= p.threshold).length;
}

// ---------------- render ----------------

function render() {
  const appEl = document.getElementById("app");
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && appEl.contains(active) && active.id) {
    focusId = active.id;
    if (typeof active.selectionStart === "number") {
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }
  appEl.innerHTML = renderAppHTML();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(selStart, selEnd); } catch (err) { /* not a text field */ }
      }
    }
  }
}

function renderAppHTML() {
  if (FIREBASE_NOT_CONFIGURED) {
    return (
      '<div class="setup-notice">' +
        "<h2>Firebase setup needed</h2>" +
        "<p>Open this file and paste your Firebase config near the top of the &lt;script&gt; tag \u2014 the same one from your index.html or manage.html if you want this synced with your existing nija-helmets project.</p>" +
      "</div>"
    );
  }
  if (!state.productsLoaded || !state.transactionsLoaded) {
    return '<div class="loading"><span class="spinner"></span> Loading stock\u2026</div>';
  }
  let body = "";
  if (state.tab === "overview") body = renderOverview();
  else if (state.tab === "in") body = renderStockForm("in");
  else if (state.tab === "out") body = renderStockForm("out");
  else if (state.tab === "history") body = renderHistory();
  else if (state.tab === "product-form") body = renderProductForm();

  return (
    '<div class="shell">' +
      renderHeader() +
      '<div class="content">' + body + "</div>" +
    "</div>"
  );
}

function renderHeader() {
  return (
    '<div class="header">' +
      '<div class="brand">' +
        '<div class="brand-left">' +
          '<div class="brand-mark">' + icon("box", 18) + "</div>" +
          '<div class="brand-text">' +
            "<h1>NIJA Helmets</h1>" +
            "<p>Stock Control</p>" +
          "</div>" +
        "</div>" +
        '<div class="brand-stat">' +
          '<div class="brand-stat-num">' + totalUnits() + "</div>" +
          '<div class="brand-stat-label">units in stock</div>' +
        "</div>" +
      "</div>" +
      (state.tab === "product-form" ? "" : renderTabsInner()) +
    "</div>"
  );
}

function renderTabsInner() {
  const tabs = [
    { id: "overview", label: "Overview", icon: "box" },
    { id: "in", label: "Stock In", icon: "up" },
    { id: "out", label: "Stock Out", icon: "down" },
    { id: "history", label: "History", icon: "history" },
  ];
  const low = lowStockCount();
  return (
    '<div class="tabs">' +
      tabs.map(t =>
        '<button type="button" class="tab-btn' + (state.tab === t.id ? " active" : "") + '" data-action="set-tab" data-tab="' + t.id + '">' +
          icon(t.icon, 14) + " " + t.label +
          (t.id === "overview" && low > 0 ? '<span class="tab-badge">' + low + "</span>" : "") +
        "</button>"
      ).join("") +
    "</div>"
  );
}

function renderOverview() {
  const filtered = state.products
    .filter(p => state.categoryFilter === "All" || p.category === state.categoryFilter)
    .filter(p => p.name.toLowerCase().includes(state.search.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name));

  const chips = ["All"].concat(CATEGORIES).map(c =>
    '<button type="button" class="chip' + (state.categoryFilter === c ? " chip-active" : "") + '" data-action="set-category" data-category="' + c + '">' + c + "</button>"
  ).join("");

  let listHtml;
  if (state.products.length === 0) {
    listHtml = renderEmptyState();
  } else if (filtered.length === 0) {
    listHtml = '<div class="empty-inline">No products match your search.</div>';
  } else {
    listHtml = '<div class="product-list">' + filtered.map(renderProductRow).join("") + "</div>";
  }

  return (
    '<div class="filter-row">' + chips +
      '<button type="button" class="btn btn-primary chip-add" data-action="open-add-modal">' + icon("plus", 13) + " Add Product</button>" +
    "</div>" +
    '<div class="search-wrap">' +
      '<span class="search-icon">' + icon("search", 15) + "</span>" +
      '<input id="search" data-field="search" value="' + escapeHtml(state.search) + '" placeholder="Search products\u2026" class="input input-search" />' +
    "</div>" +
    listHtml
  );
}

function renderProductRow(p) {
  const low = p.stock <= p.threshold;
  const confirming = state.confirmDeleteId === p.id;
  return (
    '<div class="product-row">' +
      '<div class="product-info">' +
        '<div class="product-name-row">' +
          '<span class="product-name">' + escapeHtml(p.name) + "</span>" +
          '<span class="cat-tag ' + (CATEGORY_CLASS[p.category] || "") + '">' + escapeHtml(p.category) + "</span>" +
          (low ? '<span class="low-flag">' + icon("alert", 12) + " Low</span>" : "") +
        "</div>" +
        '<div class="product-meta">' + p.stock + " in stock \u00b7 reorder at " + p.threshold + "</div>" +
      "</div>" +
      (confirming ?
        '<div class="confirm-row">' +
          '<span class="muted">Delete?</span>' +
          '<button type="button" class="btn-yes" data-action="confirm-delete" data-id="' + p.id + '">Yes</button>' +
          '<button type="button" class="btn-no" data-action="cancel-delete">No</button>' +
        "</div>"
        :
        '<div class="row-actions">' +
          '<button type="button" class="icon-btn icon-btn-up" title="Stock in" data-action="quick-in" data-id="' + p.id + '">' + icon("up", 14) + "</button>" +
          '<button type="button" class="icon-btn icon-btn-down" title="Stock out" data-action="quick-out" data-id="' + p.id + '">' + icon("down", 14) + "</button>" +
          '<button type="button" class="icon-btn" title="Edit" data-action="open-edit-modal" data-id="' + p.id + '">' + icon("pencil", 14) + "</button>" +
          '<button type="button" class="icon-btn" title="Delete" data-action="ask-delete" data-id="' + p.id + '">' + icon("trash", 14) + "</button>" +
        "</div>"
      ) +
    "</div>"
  );
}

function renderEmptyState() {
  return (
    '<div class="empty-state">' +
      icon("inbox", 30) +
      '<p class="empty-title">No products yet</p>' +
      '<p class="empty-sub">Add your first helmet, bag, glove, or motor item to start tracking stock.</p>' +
      '<button type="button" class="btn btn-primary" data-action="open-add-modal">' + icon("plus", 13) + " Add Product</button>" +
    "</div>"
  );
}

function renderStockForm(mode) {
  const isIn = mode === "in";
  const productId = isIn ? state.inProductId : state.outProductId;
  const qty = isIn ? state.inQty : state.outQty;
  const note = isIn ? state.inNote : state.outNote;
  const error = isIn ? state.inError : state.outError;
  const selected = state.products.find(p => p.id === productId);
  const sorted = state.products.slice().sort((a, b) => a.name.localeCompare(b.name));

  const heading = '<div class="form-icon-row">' + icon(isIn ? "up" : "down", 17, isIn ? "icon-up" : "icon-down") +
    "<h2>" + (isIn ? "Stock In \u2014 Supplier Delivery" : "Stock Out \u2014 Customer Sale") + "</h2></div>";

  if (state.products.length === 0) {
    return heading + '<p class="muted">Add a product first. <button type="button" class="link-btn" data-action="open-add-modal">Add one now</button></p>';
  }

  const options = '<option value="">Select a product\u2026</option>' + sorted.map(p =>
    '<option value="' + p.id + '"' + (p.id === productId ? " selected" : "") + ">" + escapeHtml(p.name) + " (" + escapeHtml(p.category) + ") \u2014 " + p.stock + " in stock</option>"
  ).join("");

  return (
    heading +
    '<form class="stock-form" data-action="submit-stock-' + mode + '">' +
      '<div class="form-group">' +
        '<label for="' + mode + 'ProductId">Product</label>' +
        '<select id="' + mode + 'ProductId" data-field="' + mode + 'ProductId" class="input">' + options + "</select>" +
      "</div>" +
      '<div class="form-group">' +
        '<label for="' + mode + 'Qty">Quantity</label>' +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" id="' + mode + 'Qty" data-field="' + mode + 'Qty" value="' + escapeHtml(qty) + '" placeholder="0" class="input" />' +
        (selected && !isIn ? '<p class="hint">' + selected.stock + " currently in stock</p>" : "") +
      "</div>" +
      '<div class="form-group">' +
        '<label for="' + mode + 'Note">' + (isIn ? "Supplier / note (optional)" : "Customer / note (optional)") + "</label>" +
        '<input id="' + mode + 'Note" data-field="' + mode + 'Note" value="' + escapeHtml(note) + '" placeholder="' + (isIn ? "e.g. ABC Trading" : "e.g. Mr. Dara") + '" class="input" />' +
      "</div>" +
      (error ? '<p class="form-error">' + escapeHtml(error) + "</p>" : "") +
      '<button type="submit" class="submit-btn ' + (isIn ? "submit-in" : "submit-out") + '">' + (isIn ? "Add Stock" : "Remove Stock") + "</button>" +
    "</form>"
  );
}

function renderHistory() {
  const filtered = state.transactions.filter(t => state.historyFilter === "all" || t.type === state.historyFilter);
  if (state.transactions.length === 0) {
    return (
      '<div class="empty-state">' + icon("history", 30) +
      '<p class="empty-title">No activity yet</p>' +
      '<p class="empty-sub">Stock in and out transactions will appear here.</p></div>'
    );
  }
  const filters = [["all", "All"], ["in", "Stock In"], ["out", "Stock Out"]];
  const chips = filters.map(f =>
    '<button type="button" class="chip' + (state.historyFilter === f[0] ? " chip-active" : "") + '" data-action="set-history-filter" data-filter="' + f[0] + '">' + f[1] + "</button>"
  ).join("");

  const rows = filtered.map(t =>
    '<div class="history-row">' +
      '<div class="history-icon ' + (t.type === "in" ? "history-icon-in" : "history-icon-out") + '">' + icon(t.type === "in" ? "up" : "down", 13) + "</div>" +
      '<div class="history-info">' +
        '<div class="history-name">' + escapeHtml(t.productName) + "</div>" +
        '<div class="history-meta">' + formatDate(t.date) + (t.note ? " \u00b7 " + escapeHtml(t.note) : "") + "</div>" +
      "</div>" +
      '<div class="history-amount ' + (t.type === "in" ? "amount-in" : "amount-out") + '">' + (t.type === "in" ? "+" : "-") + t.qty + "</div>" +
    "</div>"
  ).join("");

  return '<div class="filter-row">' + chips + '</div><div class="history-list">' + rows + "</div>";
}

function renderProductForm() {
  const editing = state.editingProductId ? state.products.find(p => p.id === state.editingProductId) : null;
  return (
    '<div class="product-form-page">' +
      '<div class="form-icon-row">' + icon(editing ? "pencil" : "plus", 16) +
        "<h2>" + (editing ? "Edit Product" : "Add Product") + "</h2>" +
      "</div>" +
      '<form data-action="submit-product">' +
        '<div class="form-group">' +
          '<label for="newName">Name</label>' +
          '<input id="newName" data-field="newName" value="' + escapeHtml(state.newName) + '" placeholder="e.g. AGV K1 Matte Black M" class="input" />' +
        "</div>" +
        '<div class="form-group">' +
          '<label for="newCategory">Category</label>' +
          '<select id="newCategory" data-field="newCategory" class="input">' +
            CATEGORIES.map(c => '<option value="' + c + '"' + (c === state.newCategory ? " selected" : "") + ">" + c + "</option>").join("") +
          "</select>" +
        "</div>" +
        (!editing ?
          '<div class="form-group">' +
            '<label for="newStock">Starting stock</label>' +
            '<input type="text" inputmode="numeric" pattern="[0-9]*" id="newStock" data-field="newStock" value="' + escapeHtml(state.newStock) + '" placeholder="0" class="input" />' +
          "</div>" : ""
        ) +
        '<div class="form-group">' +
          '<label for="newThreshold">Low stock alert at</label>' +
          '<input type="text" inputmode="numeric" pattern="[0-9]*" id="newThreshold" data-field="newThreshold" value="' + escapeHtml(state.newThreshold) + '" class="input" />' +
        "</div>" +
        (state.modalError ? '<p class="form-error">' + escapeHtml(state.modalError) + "</p>" : "") +
        '<div class="page-actions">' +
          '<button type="button" class="btn btn-secondary" data-action="close-modal">Back</button>' +
          '<button type="submit" class="btn btn-primary">Save</button>' +
        "</div>" +
      "</form>" +
    "</div>"
  );
}

// ---------------- toast (outside render cycle) ----------------

let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add("toast-show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("toast-show"); }, 2400);
}

// ---------------- actions ----------------

function setTab(tab) { state.tab = tab; render(); }
function setCategoryFilter(cat) { state.categoryFilter = cat; render(); }

function openAddModal() {
  state.returnTab = state.tab;
  state.editingProductId = null;
  state.newName = "";
  state.newCategory = CATEGORIES[0];
  state.newStock = "";
  state.newThreshold = "5";
  state.modalError = "";
  state.tab = "product-form";
  render();
  const el = document.getElementById("newName");
  if (el) el.focus();
}

function openEditModal(id) {
  const p = state.products.find(p => p.id === id);
  if (!p) return;
  state.returnTab = state.tab;
  state.editingProductId = id;
  state.newName = p.name;
  state.newCategory = p.category;
  state.newStock = "";
  state.newThreshold = String(p.threshold);
  state.modalError = "";
  state.tab = "product-form";
  render();
  const el = document.getElementById("newName");
  if (el) el.focus();
}

function closeModal() {
  state.tab = state.returnTab || "overview";
  state.editingProductId = null;
  state.modalError = "";
  render();
}

async function saveProduct() {
  const name = state.newName.trim();
  if (!name) { state.modalError = "Product name is required."; render(); return; }
  const threshold = Math.max(0, parseInt(state.newThreshold, 10) || 0);

  if (state.editingProductId) {
    try {
      await updateDoc(doc(db, "stock_products", state.editingProductId), { name: name, category: state.newCategory, threshold: threshold });
      showToast("Updated " + name);
      closeModal();
    } catch (err) {
      console.error(err);
      state.modalError = describeError(err);
      render();
    }
    return;
  }

  const startStock = Math.max(0, parseInt(state.newStock, 10) || 0);
  try {
    const ref = await addDoc(collection(db, "stock_products"), {
      name: name, category: state.newCategory, stock: startStock, threshold: threshold, createdAt: Date.now(),
    });
    if (startStock > 0) {
      await addDoc(collection(db, "stock_transactions"), {
        productId: ref.id, productName: name, type: "in", qty: startStock, note: "Initial stock", date: Date.now(),
      });
    }
    showToast("Added " + name);
    closeModal();
  } catch (err) {
    console.error(err);
    state.modalError = describeError(err);
    render();
  }
}

async function deleteProduct(id) {
  try {
    await deleteDoc(doc(db, "stock_products", id));
    state.confirmDeleteId = null;
    showToast("Product deleted");
    render();
  } catch (err) {
    console.error(err);
    state.confirmDeleteId = null;
    showToast("Could not delete: " + describeError(err));
    render();
  }
}

async function submitStockIn() {
  state.inError = "";
  const product = state.products.find(p => p.id === state.inProductId);
  const qty = parseInt(state.inQty, 10);
  if (!product) { state.inError = "Choose a product."; render(); return; }
  if (!qty || qty <= 0) { state.inError = "Enter a quantity greater than 0."; render(); return; }
  try {
    await updateDoc(doc(db, "stock_products", product.id), { stock: product.stock + qty });
    await addDoc(collection(db, "stock_transactions"), {
      productId: product.id, productName: product.name, type: "in", qty: qty, note: state.inNote.trim(), date: Date.now(),
    });
    showToast("+" + qty + " " + product.name);
    state.inProductId = ""; state.inQty = ""; state.inNote = "";
    render();
  } catch (err) {
    console.error(err);
    state.inError = describeError(err);
    render();
  }
}

async function submitStockOut() {
  state.outError = "";
  const product = state.products.find(p => p.id === state.outProductId);
  const qty = parseInt(state.outQty, 10);
  if (!product) { state.outError = "Choose a product."; render(); return; }
  if (!qty || qty <= 0) { state.outError = "Enter a quantity greater than 0."; render(); return; }
  if (qty > product.stock) { state.outError = "Only " + product.stock + " in stock."; render(); return; }
  try {
    await updateDoc(doc(db, "stock_products", product.id), { stock: product.stock - qty });
    await addDoc(collection(db, "stock_transactions"), {
      productId: product.id, productName: product.name, type: "out", qty: qty, note: state.outNote.trim(), date: Date.now(),
    });
    showToast("-" + qty + " " + product.name);
    state.outProductId = ""; state.outQty = ""; state.outNote = "";
    render();
  } catch (err) {
    console.error(err);
    state.outError = describeError(err);
    render();
  }
}

// ---------------- event delegation ----------------

const appEl = document.getElementById("app");

appEl.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "set-tab") setTab(el.dataset.tab);
  else if (action === "set-category") setCategoryFilter(el.dataset.category);
  else if (action === "set-history-filter") { state.historyFilter = el.dataset.filter; render(); }
  else if (action === "open-add-modal") openAddModal();
  else if (action === "open-edit-modal") openEditModal(el.dataset.id);
  else if (action === "close-modal") closeModal();
  else if (action === "ask-delete") { state.confirmDeleteId = el.dataset.id; render(); }
  else if (action === "cancel-delete") { state.confirmDeleteId = null; render(); }
  else if (action === "confirm-delete") deleteProduct(el.dataset.id);
  else if (action === "quick-in") { state.tab = "in"; state.inProductId = el.dataset.id; state.inError = ""; render(); }
  else if (action === "quick-out") { state.tab = "out"; state.outProductId = el.dataset.id; state.outError = ""; render(); }
});

appEl.addEventListener("submit", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  e.preventDefault();
  const action = el.dataset.action;
  if (action === "submit-stock-in") submitStockIn();
  else if (action === "submit-stock-out") submitStockOut();
  else if (action === "submit-product") saveProduct();
});

appEl.addEventListener("input", (e) => {
  if (e.target.tagName === "SELECT") return;
  const field = e.target.dataset.field;
  if (!field) return;
  let value = e.target.value;
  if (e.target.inputMode === "numeric") {
    value = value.replace(/[^0-9]/g, "");
  }
  state[field] = value;
  render();
});

appEl.addEventListener("change", (e) => {
  if (e.target.tagName !== "SELECT") return;
  const field = e.target.dataset.field;
  if (field) { state[field] = e.target.value; render(); }
});

// ---------------- Firestore live sync ----------------

if (!FIREBASE_NOT_CONFIGURED) {
  onSnapshot(collection(db, "stock_products"), (snap) => {
    state.products = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    state.productsLoaded = true;
    render();
  }, (err) => {
    console.error("stock_products listener error", err);
    state.productsLoaded = true;
    render();
  });

  const txnQuery = query(collection(db, "stock_transactions"), orderBy("date", "desc"));
  onSnapshot(txnQuery, (snap) => {
    state.transactions = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    state.transactionsLoaded = true;
    render();
  }, (err) => {
    console.error("stock_transactions listener error", err);
    state.transactionsLoaded = true;
    render();
  });
}

render();
</script>
</body>
</html>
